name: Deploy Discord System

# Review gate + release stamp, the same as getmeds_backend and getmeds_database.
#
# Every pull request runs `validate` and stops there — a PR never deploys.
# When a reviewed PR is merged into main, `stamp` waits for an approver, then
# writes a release line into the README and commits it as the repo owner. That
# owner-authored commit is what Vercel builds, so the deployment carries our
# name even though the code came from a collaborator.
#
# Pair this with Vercel -> Settings -> Git -> Ignored Build Step:
#   if [ "$VERCEL_GIT_COMMIT_AUTHOR_LOGIN" = "backenddepartment" ]; then exit 1; else exit 0; fi
# (exit 1 = build, exit 0 = skip). Without it Vercel also builds the
# collaborator's merge commit and you get two deployments, the first unapproved.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

env:
  # The single place to change who "we" are. Must be a GitHub login, and an
  # email verified on that account — otherwise GitHub will not attribute the
  # stamp commit to it and Vercel will not recognise the author.
  OWNER_LOGIN: backenddepartment
  OWNER_EMAIL: backenddepartment44@gmail.com

permissions:
  contents: read

concurrency:
  group: discord-system-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # --env-file-if-exists in package.json needs 22.9+; we run 24 locally.
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check no secrets were committed
        # .env holds the Discord webhook URLs, the bot token, RECORD_SECRET and
        # SESSION_SECRET: enough to post as us, read every record, decrypt every
        # customer name and sign in as anyone. data/ holds users.json (password
        # hashes) and the orders' customer details. Both are in .gitignore; this
        # catches a `git add -f` before it merges.
        run: |
          status=0
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error file=.env::.env is tracked by git — remove it (git rm --cached .env) and rotate every secret it contains."
            status=1
          fi
          if [ -n "$(git ls-files data/)" ]; then
            echo "::error::data/ is tracked by git — remove it (git rm -r --cached data) and reset the passwords in users.json."
            status=1
          fi
          [ "$status" -eq 0 ] && echo "No .env or data/ in the index."
          exit "$status"

      - name: Syntax check
        # Parses every file, including scripts no test starts, so a typo in a
        # rarely-used route fails here rather than on the first request.
        run: for f in src/*.js scripts/*.js test/*.js; do node --check "$f"; done

      - name: Route smoke test
        # Builds the app with no .env, the way a fresh host does, and checks the
        # two pages: the orders app at /app and the test page at /.
        run: |
          node -e "
          const app = require('./src/server');
          const server = app.listen(0, async () => {
            const base = 'http://localhost:' + server.address().port;
            try {
              for (const path of ['/app', '/', '/health']) {
                const res = await fetch(base + path);
                if (res.status !== 200) throw new Error(path + ' answered ' + res.status);
                console.log(path.padEnd(8), res.status, res.headers.get('content-type'));
              }
            } catch (err) {
              console.error(err.message);
              process.exitCode = 1;
            } finally {
              server.close();
            }
          });
          "

      - name: Orders flow
        # Sign-in, every role's steps and #order-audit as storage, against
        # test/fake-discord.js with a throwaway data folder. About 20 seconds.
        run: npm run test:orders

      - name: Discord limits
        # Each Discord limit at its edge and one past it, against the same
        # stand-in. Nothing reaches the real Discord. About 40 seconds.
        run: npm run test:limits

  stamp:
    name: Stamp release
    needs: validate
    # Three conditions, all load-bearing:
    #   - never on a pull request, so contributor code cannot reach this job;
    #   - never when the merge was already authored by the owner, since the
    #     name is correct and another stamp would only add noise;
    #   - never on our own stamp commit, which is what stops this job from
    #     re-triggering itself if a PAT is used (a GITHUB_TOKEN push does not
    #     start workflows, but a PAT push does).
    if: >-
      github.event_name != 'pull_request'
      && github.event.head_commit.author.email != 'backenddepartment44@gmail.com'
      && !contains(github.event.head_commit.message, '[release stamp]')
    runs-on: ubuntu-latest
    permissions:
      contents: write # The one job that writes, and only to push the stamp.
    environment:
      # Add required reviewers under Settings -> Environments -> production and
      # GitHub holds this job until one of them approves. Until the stamp is
      # pushed, the Ignored Build Step above means Vercel has deployed nothing
      # — so this approval is the real release gate, not a formality.
      name: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # Falls back to the built-in token. If main is protected, GITHUB_TOKEN
          # is refused by the push below unless the ruleset grants it a bypass;
          # the alternative is a RELEASE_TOKEN secret holding a PAT for the
          # owner account, which also makes the commit unambiguously ours.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Write release stamp into README
        env:
          CONTRIBUTOR: ${{ github.event.head_commit.author.name }}
          SUBJECT: ${{ github.event.head_commit.message }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # Values arrive through env rather than `${{ }}` inside the script,
        # because a commit message is contributor-controlled text and direct
        # interpolation would run it as shell on the runner.
        run: |
          python3 - <<'PY'
          import datetime, os, pathlib, re

          start, end = "<!-- release-stamp:start -->", "<!-- release-stamp:end -->"
          subject = os.environ["SUBJECT"].splitlines()[0].strip()
          stamped = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
          block = "\n".join([
              start,
              "",
              "| Field | Value |",
              "| --- | --- |",
              "| Released | " + stamped + " |",
              "| Approved by | @" + os.environ["OWNER_LOGIN"] + " |",
              "| Change from | " + os.environ["CONTRIBUTOR"] + " |",
              "| Commit | `" + os.environ["SHA"][:7] + "` — " + subject + " |",
              "| Workflow run | " + os.environ["RUN_URL"] + " |",
              "",
              end,
          ])

          readme = pathlib.Path("README.md")
          text = readme.read_text(encoding="utf-8")

          # Replaced in place when the block already exists, so the README keeps
          # a single current stamp rather than growing one section per release.
          if start in text and end in text:
              pattern = re.escape(start) + r".*?" + re.escape(end)
              text = re.sub(pattern, lambda _: block, text, flags=re.S)
          else:
              text = text.rstrip("\n") + "\n\n## Release\n\n" + block + "\n"

          readme.write_text(text, encoding="utf-8")
          print(block)
          PY

      - name: Commit and push as owner
        env:
          SHA: ${{ github.sha }}
        run: |
          git config user.name "$OWNER_LOGIN"
          git config user.email "$OWNER_EMAIL"
          git add README.md

          if git diff --cached --quiet; then
            echo "README stamp unchanged — nothing to commit."
            exit 0
          fi

          git commit -m "chore: release stamp for ${SHA:0:7} [release stamp]"

          # main can move between checkout and push when two merges land close
          # together. Rebasing and retrying costs less than failing a release
          # that is otherwise ready to go out.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Stamp pushed on attempt $attempt — Vercel builds this commit as @$OWNER_LOGIN."
              exit 0
            fi
            echo "Push rejected, rebasing onto latest main (attempt $attempt)."
            git pull --rebase origin main
          done

          echo "::error::Could not push the release stamp to main after 3 attempts."
          exit 1

      - name: Summary
        env:
          CONTRIBUTOR: ${{ github.event.head_commit.author.name }}
          SHA: ${{ github.sha }}
        run: |
          {
            echo "### Release stamped"
            echo ""
            echo "- Source commit: \`$SHA\` by $CONTRIBUTOR"
            echo "- Released as: @$OWNER_LOGIN"
            echo "- Vercel builds the stamp commit, so the deployment carries our name."
          } >> "$GITHUB_STEP_SUMMARY"
