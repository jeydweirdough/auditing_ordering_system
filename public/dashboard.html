<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard · record_database orders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/common.css">
</head>
<body>

<div class="wrap">
  <header class="top" id="site-header"></header>



  <div class="work" style="grid-template-columns: 1fr;">
    <div class="list-col" id="dashboard-content">
      <div class="dash">
        <div class="loading-state">
          <div class="spinner"></div>
          <p class="loading-text">Loading dashboard figures…</p>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<div class="viz-tip" id="viz-tip" role="tooltip" hidden></div>

<script src="/js/shared.js"></script>
<script src="/js/dashboard.js"></script>
</body>
</html>
