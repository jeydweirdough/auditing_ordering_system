<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orders · record_database</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ground: #E7EBF0;
    --surface: #FFFFFF;
    --sunk: #F4F6F9;
    --ink: #152033;
    --ink-2: #536076;
    --ink-3: #98A3B3;
    --line: #CFD7E1;
    --line-soft: #E9EDF2;
    --field: #C4CDD9;
    --lane: #DCE2EA;

    --navy: #1F3864;          /* the embed colour in Discord */
    --navy-deep: #152848;
    --navy-tint: #E2E8F3;
    --held: #A8520A;
    --held-tint: #FCEFD9;
    --ok: #16753A;
    --ok-tint: #DFF2E5;
    --bad: #B42318;
    --bad-tint: #FCE5E2;
    --blurple: #4752C4;
    --blurple-tint: #E8EAFC;

    /* charts: one series hue, validated on this surface, and the status steps for thresholds */
    --series-1: #2a78d6;
    --series-1-lift: #5598e7;
    --st-good: #0ca30c;
    --st-warning: #fab219;
    --st-serious: #ec835a;
    --st-critical: #d03b3b;
    --delta-good: #006300;

    --sans: "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  }

  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { color-scheme: light; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font: 400 15px/1.5 var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, p { margin: 0; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  .wrap {
    max-width: 1320px;
    margin: 0 auto;
    padding-inline: clamp(16px, 3vw, 36px);
    padding-block: 22px 72px;
  }
  .eyebrow { margin-bottom: 6px; font: 500 12.5px var(--mono); color: var(--ink-2); }
  h1 {
    font: 800 clamp(2.2rem, 5vw, 3.2rem)/.92 var(--sans);
    font-stretch: 62%;
    text-transform: uppercase;
    color: var(--navy);
  }
  .label {
    font: 700 12px/1.2 var(--sans);
    font-stretch: 72%;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--ink);
  }
  .title { font: 700 1.35rem/1.15 var(--sans); font-stretch: 85%; text-wrap: balance; }
  .hint { color: var(--ink-2); font-size: 13.5px; }
  .sub { color: var(--ink-2); font-size: 13.5px; }
  .mono { font-family: var(--mono); }

  /* ---------- buttons ---------- */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-height: 38px;
    padding: 7px 15px;
    border: 1px solid var(--navy);
    border-radius: 6px;
    background: var(--navy);
    color: #fff;
    font-weight: 600;
    font-size: 14.5px;
    line-height: 1.2;
    text-align: center;
  }
  .btn:hover { background: var(--navy-deep); border-color: var(--navy-deep); }
  .btn.quiet { background: var(--surface); color: var(--navy); border-color: var(--line); }
  .btn.quiet:hover { border-color: var(--navy); }
  .btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
  .btn.danger.quiet { background: var(--surface); color: var(--bad); border-color: #EBC1BC; }
  .btn.danger.quiet:hover { border-color: var(--bad); }
  .btn.small { min-height: 30px; padding: 4px 10px; font-size: 13px; }
  .btn:disabled { opacity: .55; cursor: progress; }
  .link {
    justify-self: start;
    padding: 0;
    border: 0;
    background: none;
    color: var(--navy);
    font-weight: 600;
    font-size: 13.5px;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }

  /* ---------- fields ---------- */
  .field { display: grid; gap: 5px; min-width: 0; align-content: start; }
  .field > span, .field.choice > legend {
    font: 600 11.5px/1.2 var(--sans);
    font-stretch: 72%;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--ink-2);
  }
  .field em { font-style: normal; font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--ink-3); }
  .field input, .field select, .field textarea {
    width: 100%;
    min-height: 38px;
    padding: 7px 10px;
    border: 1px solid var(--field);
    border-radius: 6px;
    background: var(--surface);
    font-size: 15px;
  }
  .field textarea { min-height: 70px; resize: vertical; line-height: 1.45; }
  .field input:focus, .field select:focus, .field textarea:focus {
    border-color: var(--navy);
    outline: 3px solid var(--navy-tint);
    outline-offset: 0;
  }
  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 14px; }
  .grid2 .wide { grid-column: 1 / -1; }
  .grid4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px 14px; }
  @media (max-width: 520px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
  .error {
    padding: 8px 11px;
    border-radius: 6px;
    background: var(--bad-tint);
    color: var(--bad);
    font-weight: 500;
    font-size: 14px;
  }
  .warn {
    padding: 9px 12px;
    border-radius: 6px;
    background: var(--held-tint);
    color: var(--held);
    font-size: 14px;
    overflow-wrap: anywhere;
  }

  /* ---------- sign-in ---------- */
  .login {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding-inline: clamp(16px, 4vw, 48px);
    padding-block: 40px;
  }
  .login-inner {
    width: 100%;
    max-width: 940px;
    display: grid;
    grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr);
    gap: 32px 52px;
    align-items: end;
    padding-bottom: 26px;
    border-bottom: 3px solid var(--navy);
  }
  .login h1 { font-size: clamp(3.4rem, 10vw, 6.4rem); }
  .lede { margin-block: 14px 22px; max-width: 44ch; color: var(--ink-2); font-size: 15.5px; }
  .login-form {
    display: grid;
    gap: 14px;
    padding: 22px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--surface);
  }
  @media (max-width: 760px) { .login-inner { grid-template-columns: minmax(0, 1fr); } }

  /* ---------- the route: an order's seven stations ---------- */
  .route-wrap { overflow-x: auto; padding-block: 4px; }
  .route {
    display: grid;
    grid-template-columns: repeat(7, minmax(66px, 1fr));
    min-width: 462px;
    margin: 0;
    padding: 0;
    list-style: none;
  }
  .stn {
    position: relative;
    display: grid;
    justify-items: center;
    align-content: start;
    gap: 5px;
    padding-inline: 2px;
    text-align: center;
  }
  .stn::before {
    content: "";
    position: absolute;
    top: 10px;
    right: 50%;
    width: 100%;
    height: 2px;
    background: var(--line);
  }
  .stn:first-child::before { display: none; }
  .stn.done::before, .stn.now::before, .stn.halt::before { background: var(--navy); }
  .dot {
    position: relative;
    z-index: 1;
    display: grid;
    place-items: center;
    width: 22px;
    height: 22px;
    border: 2px solid var(--line);
    border-radius: 50%;
    background: var(--surface);
    color: #fff;
    font: 700 15px/1 var(--sans);
  }
  .done .dot { border-color: var(--navy); background: var(--navy); }
  .done .dot::after {
    content: "";
    width: 9px;
    height: 5px;
    margin-top: -2px;
    border-left: 2px solid #fff;
    border-bottom: 2px solid #fff;
    transform: rotate(-45deg);
  }
  .now .dot { border-color: var(--navy); box-shadow: 0 0 0 4px var(--navy-tint); }
  .now .dot::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--navy); }
  .now.flag .dot { border-color: var(--held); box-shadow: 0 0 0 4px var(--held-tint); }
  .now.flag .dot::after { background: var(--held); }
  .halt .dot { border-color: var(--bad); background: var(--bad); }
  .halt .dot::after { content: "×"; margin-top: -2px; }
  .stn b { font: 600 12.5px/1.2 var(--sans); font-stretch: 85%; color: var(--ink-3); }
  .stn.done b, .stn.now b, .stn.halt b { color: var(--ink); }
  .stn small { font-size: 11px; line-height: 1.3; color: var(--ink-2); }
  .now small { color: var(--navy); font-weight: 600; }
  .now.flag small { color: var(--held); }
  .halt small { color: var(--bad); font-weight: 600; }
  /* On a phone the route runs down the page instead of across it. */
  @media (max-width: 560px) {
    .route { grid-template-columns: minmax(0, 1fr); min-width: 0; }
    .stn {
      grid-template-columns: 22px auto minmax(0, 1fr);
      justify-items: start;
      align-items: center;
      gap: 0 10px;
      padding: 0 0 12px;
      text-align: left;
    }
    .stn:last-child { padding-bottom: 0; }
    .stn::before { top: -12px; right: auto; left: 10px; width: 2px; height: 12px; }
    .stn small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  }

  /* ---------- header ---------- */
  .top {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: 14px 32px;
    padding-bottom: 14px;
    border-bottom: 3px solid var(--navy);
  }
  .who { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; }
  .who-name { font-weight: 600; }
  .role {
    padding: 5px 8px 4px;
    border-radius: 4px;
    background: var(--navy);
    color: #fff;
    font: 700 11px/1 var(--sans);
    font-stretch: 72%;
    letter-spacing: .1em;
    text-transform: uppercase;
  }
  .bar {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: 12px 20px;
    margin-block: 18px 16px;
  }
  .bar-left { display: grid; gap: 10px; min-width: 0; }
  .role-line { color: var(--ink-2); }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; }
  .tab {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    min-height: 36px;
    padding: 6px 12px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--surface);
    color: var(--ink-2);
    font-weight: 600;
    font-size: 14px;
  }
  .tab:hover { border-color: var(--navy); color: var(--navy); }
  .tab[aria-selected="true"] { border-color: var(--navy); background: var(--navy); color: #fff; }
  .count {
    padding: 3px 6px;
    border-radius: 4px;
    background: var(--line-soft);
    color: var(--ink-2);
    font: 600 12px/1 var(--mono);
  }
  .count.hot { background: var(--held-tint); color: var(--held); }
  .tab[aria-selected="true"] .count { background: rgba(255, 255, 255, .18); color: #fff; }

  /* ---------- list and detail ---------- */
  .work { display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; align-items: start; }
  .work.split { grid-template-columns: minmax(0, 1fr) minmax(0, 520px); }
  @media (max-width: 1040px) {
    .work.split { grid-template-columns: minmax(0, 1fr); }
    .work.split > .list-col { display: none; }
  }

  .order-page {
    max-width: 1040px;
    margin: 0 auto;
    padding: 24px 30px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--surface);
    box-shadow: 0 2px 8px rgba(0, 0, 0, .05);
  }
  .order-page .side-head {
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--line-soft);
  }
  .order-page .title {
    font-size: 26px;
    font-weight: 700;
  }
  .order-page .sub {
    font-size: 15px;
    color: var(--ink-2);
  }
  .order-page .block {
    background: none;
    border: 0;
    padding: 0;
  }

  .orders { overflow: hidden; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
  .row {
    display: grid;
    grid-template-columns: 158px minmax(0, 1fr) 118px 190px 92px;
    grid-template-areas: "id cust amt st age";
    gap: 4px 14px;
    align-items: center;
    width: 100%;
    padding: 11px 16px;
    border: 0;
    border-top: 1px solid var(--line-soft);
    background: none;
    text-align: left;
  }
  .row:first-child { border-top: 0; }
  button.row:hover { background: var(--sunk); }
  .row[aria-current="true"] { background: var(--navy-tint); box-shadow: inset 3px 0 0 var(--navy); }
  .row.head { padding-block: 9px; background: var(--sunk); }
  .row.head span {
    font: 700 11px/1.2 var(--sans);
    font-stretch: 72%;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--ink-2);
  }
  .id { grid-area: id; font: 500 13px var(--mono); color: var(--navy); }
  .cust { grid-area: cust; min-width: 0; }
  .cust strong, .cust small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cust strong { font-weight: 600; }
  .cust small { color: var(--ink-2); font-size: 13px; }
  .amt { grid-area: amt; text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
  .st { grid-area: st; display: grid; justify-items: start; gap: 3px; }
  .age { grid-area: age; text-align: right; color: var(--ink-2); font-size: 13px; }
  .dcflag { color: var(--bad); font-size: 12px; font-weight: 600; }
  .empty { padding: 30px 18px; color: var(--ink-2); }
  @media (max-width: 760px) {
    .row { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "id st" "cust amt"; }
    .row .age, .row.head { display: none; }
    .st { justify-items: end; }
  }
  /* Beside an open order the list is narrow, so each row takes two lines. */
  .work.split .row { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "id st" "cust amt"; }
  .work.split .row .age, .work.split .row.head { display: none; }
  .work.split .st { justify-items: end; }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 9px 4px;
    border-radius: 4px;
    font: 600 12.5px/1.1 var(--sans);
    white-space: nowrap;
  }
  .pill::before { content: ""; flex: none; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .pill.wait { background: var(--held-tint); color: var(--held); }
  .pill.move { background: var(--navy-tint); color: var(--navy); }
  .pill.ok { background: var(--ok-tint); color: var(--ok); }
  .pill.bad { background: var(--bad-tint); color: var(--bad); }
  .pill.stop { background: var(--line-soft); color: var(--ink-2); }

  /* dispatch board */
  .board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .work.split .board { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  @media (max-width: 900px) { .board { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 520px) { .board, .work.split .board { grid-template-columns: minmax(0, 1fr); } }
  .lane {
    display: grid;
    align-content: start;
    gap: 8px;
    min-height: 150px;
    padding: 10px;
    border-radius: 10px;
    background: var(--lane);
  }
  .lane h3 { display: flex; align-items: center; justify-content: space-between; padding: 2px 2px 4px; }
  .card {
    display: grid;
    gap: 2px;
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--surface);
    text-align: left;
  }
  .card:hover { border-color: var(--navy); }
  .card[aria-current="true"] { border-color: var(--navy); box-shadow: inset 3px 0 0 var(--navy); }
  .card > * { grid-area: auto; }
  .card strong { font-weight: 600; overflow-wrap: anywhere; }
  .card small { color: var(--ink-2); font-size: 12.5px; }
  .lane-empty { padding: 8px 4px; color: var(--ink-2); font-size: 13px; }

  /* the open order */
  .side {
    position: sticky;
    top: 16px;
    display: grid;
    gap: 22px;
    max-height: calc(100vh - 32px);
    overflow: auto;
    padding: 18px 20px 24px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--surface);
  }
  @media (max-width: 1040px) { .side { position: static; max-height: none; overflow: visible; } }
  .side-head { display: grid; gap: 8px; }
  .side-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; }
  .order-id { font: 600 1.35rem/1.2 var(--mono); color: var(--navy); overflow-wrap: anywhere; }
  .block { display: grid; gap: 10px; }
  .facts { display: grid; grid-template-columns: 136px minmax(0, 1fr); gap: 7px 14px; margin: 0; }
  .facts dt { color: var(--ink-2); font-size: 13.5px; }
  .facts dd { margin: 0; overflow-wrap: anywhere; white-space: pre-line; }
  @media (max-width: 420px) { .facts { grid-template-columns: minmax(0, 1fr); gap: 2px; } .facts dd { margin-bottom: 8px; } }
  .table-wrap { overflow-x: auto; }
  .items { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
  .items th {
    padding: 6px 8px;
    border-bottom: 1px solid var(--line);
    text-align: left;
    font: 700 11px/1.2 var(--sans);
    font-stretch: 72%;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--ink-2);
  }
  .items td { padding: 7px 8px; border-bottom: 1px solid var(--line-soft); vertical-align: top; overflow-wrap: anywhere; }
  .items .num { text-align: right; white-space: nowrap; }
  .items tfoot td { border-bottom: 0; font-weight: 700; }

  .step {
    display: grid;
    gap: 12px;
    padding: 14px 16px 16px;
    border: 2px solid var(--navy);
    border-radius: 10px;
    background: #F6F8FC;
  }
  .step form { display: grid; gap: 12px; }
  .quiet-box { padding: 12px 14px; border-radius: 8px; background: var(--sunk); color: var(--ink-2); font-size: 14px; }

  /* audit trail */
  .audit-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
  .trail { display: grid; margin: 4px 0 0; padding: 0; list-style: none; }
  .trail li {
    position: relative;
    display: grid;
    grid-template-columns: 14px minmax(0, 1fr);
    gap: 0 12px;
    padding-bottom: 16px;
  }
  .trail li::before {
    content: "";
    position: absolute;
    top: 18px;
    bottom: 0;
    left: 6px;
    width: 2px;
    background: var(--line);
  }
  .trail li:last-child { padding-bottom: 0; }
  .trail li:last-child::before { display: none; }
  .tick { width: 14px; height: 14px; margin-top: 4px; border: 3px solid var(--navy-tint); border-radius: 50%; background: var(--navy); }
  .tick.bad { border-color: var(--bad-tint); background: var(--bad); }
  .what { font-weight: 600; }
  .change { font-weight: 400; font-size: 13.5px; color: var(--ink-2); }
  .by { font-size: 13px; color: var(--ink-2); }
  .note {
    margin-top: 5px;
    padding: 7px 10px;
    border-radius: 6px;
    background: var(--sunk);
    font-size: 14px;
    white-space: pre-line;
    overflow-wrap: anywhere;
  }
  .details { margin-top: 4px; font-size: 13.5px; overflow-wrap: anywhere; }
  .dc {
    display: inline-block;
    margin-top: 5px;
    padding: 2px 7px;
    border-radius: 4px;
    font: 500 11.5px/1.5 var(--mono);
    overflow-wrap: anywhere;
  }
  .dc.sent { background: var(--blurple-tint); color: var(--blurple); }
  .dc.wait { background: var(--held-tint); color: var(--held); }
  .dc.bad { background: var(--bad-tint); color: var(--bad); }
  .dc.off { background: var(--line-soft); color: var(--ink-2); }

  /* order form */
  .items-edit { display: grid; gap: 10px; min-width: 0; margin: 0; padding: 0; border: 0; }
  .items-edit legend { margin-bottom: 8px; padding: 0; }
  .item-rows { display: grid; gap: 12px; }
  .item-row {
    display: grid;
    grid-template-columns: minmax(0, 1.4fr) minmax(0, 100px) 74px minmax(0, 120px) minmax(0, 100px) 38px;
    grid-template-areas: "p p p p p p" "t k q u a r" "h h h h h h";
    gap: 8px;
    padding: 10px 12px;
    border: 1px solid var(--line-soft);
    border-radius: 8px;
    background: var(--sunk);
  }

  /* ---------- dashboards: one main panel, then four cards of the same size ---------- */

  .dash-card { display: grid; grid-template-rows: auto auto 1fr auto; gap: 6px; padding: 16px 18px; min-height: 176px; }
  .card-fig { font: 700 1.95rem/1.1 var(--sans); color: var(--ink); overflow-wrap: anywhere; }

  /* the column chart: one hue, bars at most 24px, 4px round tops, hairline grid */
  .viz { display: grid; gap: 10px; margin: 0; }

  .viz-y { position: relative; min-width: 3.4em; height: 180px; color: var(--ink-3); font: 500 11.5px/1 var(--sans); font-variant-numeric: tabular-nums; }

  .col { display: flex; align-items: flex-end; justify-content: center; height: 100%; padding: 0; border: 0; background: none; }

  .viz-table summary { width: fit-content; color: var(--navy); font-size: 13px; font-weight: 600; cursor: pointer; }

  .spark { display: block; width: 100%; height: 34px; margin-top: 4px; }

  /* payment aging: one stacked bar in the status steps, 2px gaps, each band named beside it */

  .legend { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 18px; margin: 0; padding: 0; list-style: none; }
  .legend li { display: grid; grid-template-columns: 12px minmax(0, 1fr); gap: 1px 8px; font-size: 13.5px; }

  /* tables inside dashboards, with a thin bar beside the value that matters */

<body>

<main id="login" class="login" hidden>
  <div class="login-inner">
    <div>
      <p class="eyebrow">record_database</p>
      <h1>Orders</h1>
      <p class="lede">Salesperson raises the order. Management approves it, Finance verifies payment, and Dispatch picks, packs and ships it. Each step is recorded with who did it, and when.</p>
      <div class="route-wrap"><ol class="route" id="legend" aria-label="The steps every order goes through"></ol></div>
    </div>

      <label class="field" for="login-password"><span>Password</span><input id="login-password" type="password" autocomplete="current-password" required></label>

      <button type="submit" class="btn">Sign in</button>

    </form>
  </div>
</main>

<div id="app" class="wrap" hidden>
  <header class="top">

      <p class="eyebrow">record_database · orders</p>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<dialog class="modal" id="for-dialog" aria-labelledby="for-title"></dialog>

<div class="viz-tip" id="viz-tip" role="tooltip" hidden></div>

<script>
'use strict';

const $ = (sel, root = document) => root.querySelector(sel);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const TZ = 'Asia/Manila';
const pesoFormat = new Intl.NumberFormat('en-PH', { style: 'currency', currency: 'PHP' });
const peso = (n) => pesoFormat.format(Number(n) || 0);
const stampFormat = new Intl.DateTimeFormat('en-PH', { timeZone: TZ, day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });
const stamp = (iso) => stampFormat.format(new Date(iso));
const dateKey = (d) => new Intl.DateTimeFormat('en-CA', { timeZone: TZ }).format(d);
const briefTime = new Intl.DateTimeFormat('en-PH', { timeZone: TZ, hour: 'numeric', minute: '2-digit' });
const briefDay = new Intl.DateTimeFormat('en-PH', { timeZone: TZ, day: 'numeric', month: 'short' });
// The time if it was today in Manila, otherwise the date: short enough for a route station.
const brief = (iso) => {
  const d = new Date(iso);
  return dateKey(d) === dateKey(new Date()) ? briefTime.format(d) : briefDay.format(d);
};
const dayFormat = new Intl.DateTimeFormat('en-PH', { timeZone: 'UTC', day: 'numeric', month: 'short', year: 'numeric' });
const day = (ymd) => dayFormat.format(new Date(`${ymd}T00:00:00Z`));
const today = () => new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;

function ago(iso) {
  const s = (Date.now() - Date.parse(iso)) / 1000;
  if (s < 60) return 'just now';
  if (s < 3600) return `${Math.floor(s / 60)} min ago`;
  if (s < 86400) return `${Math.floor(s / 3600)} h ago`;
  return stamp(iso);
}

const DONE = new Set(['completed', 'cancelled', 'rejected']);
const IN_DISPATCH = ['ready_for_dispatch', 'picking', 'packed', 'dispatched'];
const TONE = {
  pending_approval: 'wait', returned: 'wait', awaiting_payment: 'wait', on_hold: 'bad',
  ready_for_dispatch: 'move', picking: 'move', packed: 'move', dispatched: 'move',
  completed: 'ok', rejected: 'stop', cancelled: 'stop', deleted: 'stop',
};
const pill = (status, label) => `<span class="pill ${TONE[status] ?? 'stop'}">${esc(label)}</span>`;

const CREATORS = ['salesperson', 'management', 'admin'];

const INTRO = {
  salesperson: 'Raise orders, and fix the ones Management sends back.',
  management: 'Approve new orders, send them back for changes, or reject them. You can raise orders too, for yourself or a salesperson.',
  finance: 'Verify payment on approved orders, or put them on hold.',
  dispatch: 'Pick, pack and dispatch paid orders, then mark them delivered.',
  admin: 'Create, edit, delete and restore any order, and manage who can sign in. Every change is logged in #order-audit.',
};

// Each role's dashboard. needs: the queue that waits on this role, so its count stands out.
const TABS = {
  salesperson: [
    { key: 'dashboard', label: 'Dashboard' },
    { key: 'returned', label: 'Sent back to you', needs: true, match: (o) => o.status === 'returned', empty: 'Nothing has been sent back to you.' },
    { key: 'active', label: 'In progress', match: (o) => !DONE.has(o.status) && o.status !== 'returned', empty: 'No orders in progress. Raise one with New order.' },
    { key: 'done', label: 'Finished', match: (o) => DONE.has(o.status), empty: 'No finished orders yet.' },
  ],
  management: [
    { key: 'dashboard', label: 'Dashboard' },
    { key: 'approval', label: 'Waiting for approval', needs: true, match: (o) => o.status === 'pending_approval', empty: 'Nothing is waiting for approval.' },
    { key: 'active', label: 'In progress', match: (o) => !DONE.has(o.status) && o.status !== 'pending_approval', empty: 'No approved orders are in progress.' },
    { key: 'done', label: 'Finished', match: (o) => DONE.has(o.status), empty: 'No finished orders yet.' },
  ],
  finance: [
    { key: 'dashboard', label: 'Dashboard' },
    { key: 'payment', label: 'Awaiting payment', needs: true, match: (o) => o.status === 'awaiting_payment', empty: 'No approved orders are waiting for payment.' },
    { key: 'hold', label: 'On hold', needs: true, match: (o) => o.status === 'on_hold', empty: 'No orders are on hold.' },
    { key: 'verified', label: 'Payment verified', match: (o) => [...IN_DISPATCH, 'completed'].includes(o.status), empty: 'No payments verified yet.' },
  ],
  dispatch: [
    { key: 'board', label: 'Dispatch board', needs: true, board: true, match: (o) => IN_DISPATCH.includes(o.status) },
    { key: 'delivered', label: 'Delivered', match: (o) => o.status === 'completed', empty: 'Nothing delivered yet.' },
  ],
  admin: [
    { key: 'dashboard', label: 'Dashboard' },
    { key: 'all', label: 'All orders', match: (o) => o.status !== 'deleted', empty: 'No orders yet. Raise one with New order.' },
    { key: 'discord', label: 'Not in Discord', needs: true, match: (o) => o.discordProblem, empty: 'Every step is stored in #order-audit.' },
    { key: 'deleted', label: 'Deleted', match: (o) => o.status === 'deleted', empty: 'No deleted orders. Deleting keeps the order and its thread, so it can be restored.' },
    { key: 'people', label: 'People' },
  ],
};

const LANES = [
  ['ready_for_dispatch', 'Ready for dispatch'],
  ['picking', 'Picking'],
  ['packed', 'Packed'],
  ['dispatched', 'Dispatched'],
];

// The seven stations of an order, each completed by one kind of step.
const ROUTE = [
  { type: 'created', label: 'Raised', who: 'Salesperson' },
  { type: 'approve', label: 'Approved', who: 'Management' },
  { type: 'verify_payment', label: 'Payment verified', who: 'Finance' },
  { type: 'start_picking', label: 'Picking', who: 'Dispatch' },
  { type: 'mark_packed', label: 'Packed', who: 'Dispatch' },
  { type: 'dispatch', label: 'Dispatched', who: 'Dispatch' },
  { type: 'deliver', label: 'Delivered', who: 'Dispatch' },
];
const REACHED = {
  pending_approval: 1, returned: 1, rejected: 1, awaiting_payment: 2, on_hold: 2,
  ready_for_dispatch: 3, picking: 4, packed: 5, dispatched: 6, completed: 7,
};
const PLACEHOLDERS = {
  customerName: 'e.g. Sto. Niño Pharmacy',
  contactNumber: 'e.g. 0917 123 4567',
  address: 'Complete hospital, clinic, or residential shipping address',
  receiverName: 'Who will receive the delivery',
  receiverContact: '09XXXXXXXXX',
  subDivision: 'e.g. MD Telesales',
  paymentTerms: 'e.g. Net 15, 30 days',
  deliveryMethod: 'e.g. LBC, Grab Express, Own Rider',
  doctorName: 'Referring or prescribing doctor',
  remarks: "e.g. Attn: Dr. Santos, Room 302. Handle with cold chain packaging. Write 'None' if there are no special instructions.",
  notes: 'Anything Finance or Dispatch should know',
};

const S = {
  user: null, meta: null, orders: [], tab: null,
  page: null,        // 'new' | null
  side: null,        // 'order' | 'resubmit' | 'edit'
  openId: null, order: null,
  formFor: null,     // the step whose form is open
  people: null, reveal: null, timer: null,
  staged: [],        // files picked for a new order: { name, size, kind, file }
  orderFor: null,    // who a new order is for: null for me, or { id, name } of a salesperson
  dash: { period: 'month', data: null },   // the dashboard's period, and its last figures
};

// ---------- talking to the server ----------

class SignedOut extends Error {}

async function api(method, url, body) {
  let res;
  try {
    res = await fetch(url, {
      method,
      headers: body === undefined ? {} : { 'Content-Type': 'application/json' },
      body: body === undefined ? undefined : JSON.stringify(body),
    });
  } catch {
    throw new Error("Can't reach the server. Is it running (npm run dev)?");
  }
  const data = await res.json().catch(() => ({}));
  if (res.status === 401 && url !== '/api/auth/login') {
    signedOut(S.user ? 'Your sign-in has ended. Sign in again.' : null);
    throw new SignedOut();
  }
  if (res.status === 413 && !data.error) throw new Error('The files are too large to send. Keep them under 3 MB in all.');   // Vercel's own limit
  if (!res.ok) throw new Error(data.error || `The server answered ${res.status}.`);
  return data;
}

function toast(message, kind = '') {
  const t = $('#toast');
  t.textContent = message;
  t.className = `toast ${kind}`;
  t.hidden = false;
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => { t.hidden = true; }, 4500);
}

// ---------- signing in and out ----------

function signedOut(message) {
  clearTimeout(S.timer);
  Object.assign(S, { user: null, meta: null, orders: [], tab: null, side: null, openId: null, order: null, formFor: null, people: null, reveal: null });
  $('#app').hidden = true;
  $('#login').hidden = false;
  document.title = 'Orders · record_database';
  const err = $('#login-error');
  err.textContent = message ?? '';
  err.hidden = !message;
  $('#login-email').focus();
}

async function enter(user) {
  S.user = user;
  S.dash = { period: 'month', data: null };
  S.meta = await api('GET', '/api/orders/meta');
  $('#login').hidden = true;
  $('#app').hidden = false;
  $('#who-name').textContent = user.name;
  $('#who-role').textContent = user.roleLabel;
  $('#role-line').textContent = INTRO[user.role];
  const store = S.meta.storage;
  const storageNote = store.error
    ? `Orders couldn't be read from #order-audit, so new orders are refused until that's fixed and the server restarts. ${store.error}`
    : store.kind !== 'discord' ? "Orders are kept in memory only and are lost when the server stops. They're stored in Discord in live mode with the bot's token." : '';
  $('#storage-line').textContent = storageNote;
  $('#storage-line').hidden = !storageNote;
  $('#new-order').hidden = !['salesperson', 'management', 'admin'].includes(user.role);
  document.title = `${user.roleLabel} · Orders`;
  await loadOrders();
  const wanted = decodeURIComponent(location.hash.slice(1));
  if (location.pathname === '/new-order' || wanted === 'new') openNewOrderPage();
  else if (/^(?:GM|ORD)-\d{8}-\d{4}$/.test(wanted)) openOrder(wanted);
  else layout();
  schedule();
}

$('#login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = e.target.querySelector('[type=submit]');
  const err = $('#login-error');
  btn.disabled = true;
  err.hidden = true;
  try {
    const { user } = await api('POST', '/api/auth/login', { email: $('#login-email').value, password: $('#login-password').value });
    $('#login-password').value = '';
    await enter(user);
  } catch (error) {
    if (!(error instanceof SignedOut)) {
      err.textContent = error.message;
      err.hidden = false;
    }
  } finally {
    btn.disabled = false;
  }
});

$('#sign-out').addEventListener('click', async () => {
  try { await api('POST', '/api/auth/logout', {}); } catch { /* signed out either way */ }
  signedOut(null);
});

// ---------- the dashboard ----------

const currentTab = () => TABS[S.user.role].find((t) => t.key === S.tab) ?? TABS[S.user.role][0];

function renderTabs() {
  const tabs = TABS[S.user.role];
  if (!tabs.some((t) => t.key === S.tab)) S.tab = tabs[0].key;   // the dashboard, or Dispatch's board
  $('#tabs').innerHTML = tabs.map((t) => {
    const n = t.match ? S.orders.filter(t.match).length : null;
    const on = !S.page && t.key === S.tab;
    const count = n === null ? '' : `<span class="count${t.needs && n && !on ? ' hot' : ''}">${n}</span>`;
    return `<button type="button" class="tab" role="tab" aria-selected="${on}" data-tab="${t.key}">${esc(t.label)}${count}</button>`;
  }).join('');
}

function renderMain() {
  renderTabs();
  if (S.page === 'new') {
    $('#main').innerHTML = `<div class="order-page">${orderForm(null, 'new')}</div>`;
    recalc();
    $('#main [name=customerName]')?.focus();
    return;
  }
  const tab = currentTab();
  if (tab.key === 'dashboard') return renderDashboard();
  if (tab.key === 'people') {
    if (!$('#people-panel')) {
      $('#main').innerHTML = '<div class="panel" id="people-panel"><p class="hint">Loading people…</p></div>';
      renderPeople();
    }
    return;
  }
  const list = S.orders.filter(tab.match);
  $('#main').innerHTML = tab.board ? board(list) : table(list, tab.empty);
}

function layout() {
  if (S.page === 'new') {
    $('#work').classList.remove('split');
    $('#side').hidden = true;
    renderMain();
    return;
  }
  $('#work').classList.toggle('split', Boolean(S.side));
  $('#side').hidden = !S.side;
  renderMain();
}

async function loadOrders() {
  const { orders } = await api('GET', '/api/orders');
  S.orders = orders;
  renderMain();
}

function table(list, empty) {
  if (!list.length) return `<div class="orders"><p class="empty">${esc(empty)}</p></div>`;
  const showOwner = S.user.role !== 'salesperson';
  const rows = list.map((o) => `
    <button type="button" class="row" data-open="${esc(o.id)}" aria-current="${o.id === S.openId}">
      <span class="id">${esc(o.id)}</span>
      <span class="cust"><strong>${esc(o.customerName)}</strong><small>${esc(o.division)} · ${plural(o.items, 'item')}${showOwner ? ` · by ${esc(o.owner)}` : ''}</small></span>
      <span class="amt">${peso(o.total)}</span>
      <span class="st">${pill(o.status, o.statusLabel)}${o.discordProblem ? '<small class="dcflag">Not in Discord</small>' : ''}</span>
      <span class="age">${esc(ago(o.updatedAt))}</span>
    </button>`).join('');
  return `<div class="orders">
    <div class="row head" aria-hidden="true"><span class="id">Order</span><span class="cust">Customer</span><span class="amt">Total</span><span class="st">Status</span><span class="age">Updated</span></div>
    ${rows}
  </div>`;
}

function board(list) {
  return `<div class="board">${LANES.map(([status, label]) => {
    const cards = list.filter((o) => o.status === status);
    const body = cards.map((o) => `
      <button type="button" class="card" data-open="${esc(o.id)}" aria-current="${o.id === S.openId}">
        <span class="id">${esc(o.id)}</span>
        <strong>${esc(o.customerName)}</strong>
        <small>${esc(o.division)} · ${plural(o.items, 'item')}</small>
        <small>${esc(ago(o.updatedAt))}${o.discordProblem ? ' · <span class="dcflag">Not in Discord</span>' : ''}</small>
      </button>`).join('');
    return `<section class="lane"><h3 class="label"><span>${esc(label)}</span><span class="count">${cards.length}</span></h3>${body || '<p class="lane-empty">Nothing here.</p>'}</section>`;
  }).join('')}</div>`;
}

$('#tabs').addEventListener('click', (e) => {
  const t = e.target.closest('[data-tab]');
  if (!t) return;
  S.page = null;
  S.tab = t.dataset.tab;
  history.replaceState(null, '', location.pathname === '/new-order' ? '/app' : location.pathname + location.search);
  layout();
});

// ---------- dashboards ----------

// Each role's dashboard: one main panel for what the role is there to watch, then four cards of the
// same size. The period switch above scopes every figure; cards tagged Now are as things stand.
// The server works the figures out (/api/orders/dashboard); this only lays them out.
const PHP0 = new Intl.NumberFormat('en-PH', { style: 'currency', currency: 'PHP', maximumFractionDigits: 0 });
const PHP_SHORT = new Intl.NumberFormat('en-PH', { style: 'currency', currency: 'PHP', notation: 'compact', maximumFractionDigits: 1 });
const php = (n) => PHP0.format(Math.round(Number(n) || 0));
const phpShort = (n) => (Math.abs(n) >= 100_000 ? PHP_SHORT.format(n) : php(n));
const signedPhp = (n) => `${n >= 0 ? '+' : '−'}${php(Math.abs(n))}`;
const whole = (n) => Number(n ?? 0).toLocaleString('en-PH');
const pct = (x) => (x == null ? '–' : `${Math.round(x * 100)}%`);
const rate100 = (x) => (x == null ? null : x * 100);
const points = (x) => `${Math.round(x)} pts`;
const howLong = (h) => (h == null ? '–' : h < 1 ? `${Math.max(1, Math.round(h * 60))} min` : h < 48 ? `${Math.round(h)} h` : `${Math.round(h / 24)} days`);
const ageText = (days) => (days < 1 ? 'under a day' : plural(days, 'day'));
const UNIT = { month: 'day', last_month: 'day', '90d': 'week', all: 'month' };
const updatedText = (d) => `Updated ${briefTime.format(new Date(d.at))}`;

// "▲ +₱12,000 vs the same days last month": green when that's good, red when it isn't. The arrow
// and the sign say which way, so it never rests on colour. Nothing to compare with, no line.
function delta(now, prev, fmt, goodUp = true) {
  const compare = S.dash.data?.period.compare;
  if (!compare || now == null || prev == null) return '';
  const diff = now - prev;
  if (Math.abs(diff) < 0.005) return `<p class="delta">No change vs ${esc(compare)}</p>`;
  const tone = (diff > 0) === goodUp ? 'good' : 'bad';
  return `<p class="delta ${tone}"><span aria-hidden="true">${diff > 0 ? '▲' : '▼'}</span> ${diff > 0 ? '+' : '−'}${esc(fmt(Math.abs(diff)))} vs ${esc(compare)}</p>`;
}

// A round top for the y-axis: 1, 2, 2.5 or 5 times a power of ten.
function niceMax(v) {
  if (v <= 0) return 0;
  const p = 10 ** Math.floor(Math.log10(v));
  return [1, 2, 2.5, 5, 10].map((m) => m * p).find((m) => m >= v);
}

const dashHero = ({ label, tag = '', value, sub = '', body = '' }) => `
  <section class="dash-hero">
    <div class="hero-head">
      <h2 class="label">${esc(label)}${tag ? ` <span class="tag">${esc(tag)}</span>` : ''}</h2>
      <p class="hero-fig">${esc(value)}</p>
      ${sub}
    </div>
    ${body}
  </section>`;

const dashCard = ({ label, tag = '', value, sub = '', foot = '' }) => `
  <section class="dash-card">
    <h3 class="label">${esc(label)}${tag ? ` <span class="tag">${esc(tag)}</span>` : ''}</h3>
    <p class="card-fig">${esc(value)}</p>
    <div class="card-sub">${sub}</div>
    ${foot ? `<div class="card-foot">${foot}</div>` : ''}
  </section>`;

// Sales over the period, a column per day, week or month: one hue, at most 24px wide, 4px round
// tops, hairline grid. Each column is focusable and has its own tooltip, and the table view below
// holds every value too.
function colChart(trend, unit) {
  const max = niceMax(Math.max(0, ...trend.map((b) => b.value)));
  const every = Math.ceil(trend.length / 6);   // about six labels along the bottom
  const cols = trend.map((b) => `<button type="button" class="col" style="--h:${max ? (b.value / max) * 100 : 0}%"
      data-tip-value="${esc(php(b.value))}" data-tip-label="${esc(`${b.label} · ${plural(b.count, 'order')}`)}"
      aria-label="${esc(`${b.label}: ${php(b.value)}, ${plural(b.count, 'order')}`)}"><span></span></button>`).join('');
  const xs = trend.map((b, i) => `<span>${i % every === 0 ? esc(b.label) : ''}</span>`).join('');
  const rows = trend.map((b) => `<tr><td>${esc(b.label)}</td><td class="num">${esc(php(b.value))}</td><td class="num">${b.count}</td></tr>`).join('');
  return `<figure class="viz" aria-label="Sales by ${esc(unit)}">
      <div class="viz-plot">
        <div class="viz-y" aria-hidden="true"><span style="top:0">${esc(phpShort(max))}</span><span style="top:50%">${esc(phpShort(max / 2))}</span><span style="top:100%">₱0</span></div>
        <div class="viz-area">
          <div class="viz-grid" aria-hidden="true"><i style="top:0"></i><i style="top:50%"></i><i class="base" style="top:100%"></i></div>
          <div class="viz-cols" style="--n:${trend.length}">${cols}</div>
          <div class="viz-x" style="--n:${trend.length}" aria-hidden="true">${xs}</div>
        </div>
      </div>
      <details class="viz-table"><summary>Show as a table</summary>
        <div class="table-wrap"><table class="dash-table">
          <thead><tr><th>${esc(unit[0].toUpperCase() + unit.slice(1))}</th><th class="num">Sales</th><th class="num">Orders</th></tr></thead>
          <tbody>${rows}</tbody>
        </table></div>
      </details>
    </figure>`;
}

// A small trend line in the quiet grey, for a card. Decoration only: the figure above it says it.
function spark(values) {
  const max = Math.max(0, ...values);
  if (values.length < 2 || !max) return '';
  const pts = values.map((v, i) => `${((i / (values.length - 1)) * 100).toFixed(2)},${(29 - (v / max) * 27).toFixed(2)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 100 30" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts}"/></svg>`;
}

// A running total, so a card's line climbs through the period instead of zigzagging day to day.
const running = (xs) => {
  let sum = 0;
  return xs.map((x) => (sum += x));
};

// Money waiting for payment, banded by days since approval: one stacked bar in the status steps,
// each band named with its figures beside it, so the bands never rest on colour alone.
function agingBar(aging) {
  const total = aging.reduce((s, b) => s + b.value, 0);
  const segs = aging.map((b, i) => (b.value ? `<button type="button" class="seg a${i}" style="flex-grow:${b.value}"
      data-tip-value="${esc(php(b.value))}" data-tip-label="${esc(`${b.label} · ${b.days} · ${plural(b.count, 'order')}`)}"
      aria-label="${esc(`${b.label}, ${b.days}: ${php(b.value)}, ${plural(b.count, 'order')}`)}"></button>` : '')).join('');
  const legend = aging.map((b, i) => `<li><i class="sw a${i}" aria-hidden="true"></i><span>${esc(b.label)} <small>${esc(b.days)}</small></span><strong>${esc(php(b.value))}</strong><small>${plural(b.count, 'order')}</small></li>`).join('');
  return `<div class="aging">${total ? `<div class="stack">${segs}</div>` : '<p class="quiet-box">Nothing is waiting for payment.</p>'}<ul class="legend">${legend}</ul></div>`;
}

const barCell = (value, max) => `<td><span class="inbar-cell"><span class="inbar" aria-hidden="true"><i style="--w:${max ? (value / max) * 100 : 0}%"></i></span><span class="num">${esc(php(value))}</span></span></td>`;

// A few orders as rows that open them. right: the figure on the right, as HTML.
const orderLinks = (list, right) => `<ul class="mini">${list.map((o) => `<li><button type="button" class="mini-row" data-open="${esc(o.id)}">
    <span class="id">${esc(o.id)}</span><span class="mini-name">${esc(o.customer ?? o.owner)}</span><span class="num">${right(o)}</span>
  </button></li>`).join('')}</ul>`;

function salespersonDash(d) {
  const { now: n, prev: p } = d;
  return `
    ${dashHero({
      label: `Your sales · ${d.period.label}`,
      value: php(n.sales),
      sub: `${delta(n.sales, p?.sales, php)}<p class="hint">Orders you raised in this period, less any cancelled or rejected.</p>`,
      body: n.raised ? colChart(d.trend, UNIT[d.period.key]) : '<p class="quiet-box">You haven’t raised an order in this period yet.</p>',
    })}
    <div class="dash-cards">
      ${dashCard({ label: 'Orders raised', value: whole(n.raised), sub: delta(n.raised, p?.raised, whole) })}
      ${dashCard({ label: 'Approval rate', value: pct(n.approvalRate), sub: `<p class="hint">${n.approved} approved of ${plural(n.decisions, 'decision')} by Management</p>${delta(rate100(n.approvalRate), rate100(p?.approvalRate), points)}` })}
      ${dashCard({ label: 'Delivered', value: php(n.deliveredValue), sub: `<p class="hint">${plural(n.delivered, 'order')} delivered</p>${delta(n.deliveredValue, p?.deliveredValue, php)}` })}
      ${dashCard({
        label: 'Sent back to you',
        tag: 'Now',
        value: whole(d.sentBack),
        sub: `<p class="hint">${d.sentBack ? 'Waiting for your changes.' : 'Nothing to fix.'}</p>`,
        foot: d.sentBack ? '<button type="button" class="link" data-go-tab="returned">Fix them</button>' : '',
      })}
    </div>`;
}

function managementDash(d) {
  const { now: n, prev: p } = d;
  const max = Math.max(0, ...d.team.map((t) => t.value));
  const rows = d.team.map((t) => `<tr><td>${esc(t.name)}</td><td class="num">${t.approved}</td>${barCell(t.value, max)}<td class="num">${t.sentBack}</td><td class="num">${t.rejected}</td><td class="num">${esc(php(t.delivered))}</td></tr>`).join('');
  const table = d.team.length ? `<div class="table-wrap"><table class="dash-table">
      <thead><tr><th>Salesperson</th><th class="num">Approved</th><th>Value approved</th><th class="num">Sent back</th><th class="num">Rejected</th><th class="num">Delivered</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>` : '<p class="quiet-box">You haven’t decided on any orders in this period yet.</p>';
  const w = d.waiting;
  return `
    ${dashHero({
      label: `Your team · ${d.period.label}`,
      value: php(n.approvedValue),
      sub: `${delta(n.approvedValue, p?.approvedValue, php)}<p class="hint">Approved by you, across ${plural(n.approved, 'order')}. Your team is the salespeople whose orders you decided on.</p>`,
      body: table,
    })}
    <div class="dash-cards">
      ${dashCard({
        label: 'Waiting for you',
        tag: 'Now',
        value: whole(w.count),
        sub: `<p class="hint">${w.count ? `${php(w.value)} · oldest ${ageText(w.oldestDays)}` : 'Nothing is waiting for approval.'}</p>`,
        foot: w.count ? '<button type="button" class="link" data-go-tab="approval">Review them</button>' : '',
      })}
      ${dashCard({ label: 'Approval rate', value: pct(n.approvalRate), sub: `<p class="hint">${n.approved} approved · ${n.sentBack} sent back · ${n.rejected} rejected</p>${delta(rate100(n.approvalRate), rate100(p?.approvalRate), points)}` })}
      ${dashCard({ label: 'Time to decide', value: howLong(n.decideHours), sub: `<p class="hint">Median, from an order reaching you to your decision</p>${delta(n.decideHours, p?.decideHours, howLong, false)}` })}
      ${dashCard({ label: 'Team delivered', value: php(n.delivered), sub: `<p class="hint">Orders you approved, delivered in this period</p>${delta(n.delivered, p?.delivered, php)}` })}
    </div>`;
}

function financeDash(d) {
  const { awaiting: a, large, mismatches: m, onHold: h, verified: v } = d;
  const dayPill = (days) => `<span class="pill ${days > 14 ? 'bad' : days > 7 ? 'wait' : 'stop'}">${ageText(days)}</span>`;
  const oldest = a.oldest.length ? `<div class="hero-list"><h3 class="label">Waiting longest</h3>${orderLinks(a.oldest, (o) => `${esc(php(o.total))} ${dayPill(o.days)}`)}</div>` : '';
  return `
    ${dashHero({
      label: 'Awaiting payment',
      tag: 'Now',
      value: php(a.value),
      sub: `<p class="hint">${plural(a.count, 'approved order')} waiting for payment, by days since approval.</p>`,
      body: `${agingBar(a.aging)}${oldest}`,
    })}
    <div class="dash-cards">
      ${dashCard({
        label: 'Large orders',
        tag: 'Now',
        value: whole(large.count),
        sub: `<p class="hint">Open orders of ${php(large.threshold)} or more${large.count ? `, ${php(large.value)} in all` : ''}. Give them a second look before verifying payment.</p>`,
        foot: large.top.length ? orderLinks(large.top, (o) => esc(php(o.total))) : '',
      })}
      ${dashCard({
        label: 'Amount mismatches',
        value: whole(m.count),
        sub: `<p class="hint">${m.count ? `Verified payments that differ from the order total: ${esc(signedPhp(m.net))} net.` : 'Every payment verified in this period matched its order total.'}</p>${delta(m.count, m.prevCount, whole, false)}`,
        foot: m.top.length ? orderLinks(m.top, (o) => esc(signedPhp(o.received - o.total))) : '',
      })}
      ${dashCard({
        label: 'On hold',
        tag: 'Now',
        value: whole(h.count),
        sub: `<p class="hint">${h.count ? `${php(h.value)} held · longest ${ageText(h.longestDays)}` : 'No orders are on hold.'}</p>`,
        foot: h.count ? '<button type="button" class="link" data-go-tab="hold">Open them</button>' : '',
      })}
      ${dashCard({ label: 'Payments verified', value: php(v.received), sub: `<p class="hint">${plural(v.count, 'payment')} verified in this period</p>${delta(v.received, v.prevReceived, php)}` })}
    </div>`;
}

function adminDash(d) {
  const { now: n, prev: p } = d;
  const inactive = (u) => (u.active ? '' : ' <span class="tag">Inactive</span>');
  const maxSales = Math.max(0, ...d.salespeople.map((s) => s.sales));
  const sales = d.salespeople.length ? `<div class="table-wrap"><table class="dash-table">
      <thead><tr><th>Salesperson</th><th class="num">Raised</th><th>Sales</th><th class="num">Delivered</th><th class="num">Approval rate</th></tr></thead>
      <tbody>${d.salespeople.map((s) => `<tr><td>${esc(s.name)}${inactive(s)}</td><td class="num">${s.raised}</td>${barCell(s.sales, maxSales)}<td class="num">${esc(php(s.deliveredValue))}</td><td class="num">${pct(s.approvalRate)}</td></tr>`).join('')}</tbody>
    </table></div>` : '<p class="quiet-box">No salespeople yet.</p>';
  const managers = d.managers.length ? `<div class="table-wrap"><table class="dash-table">
      <thead><tr><th>Manager</th><th class="num">Decisions</th><th class="num">Approved</th><th class="num">Sent back</th><th class="num">Rejected</th><th class="num">Time to decide</th></tr></thead>
      <tbody>${d.managers.map((m) => `<tr><td>${esc(m.name)}${inactive(m)}</td><td class="num">${m.decisions}</td><td class="num">${m.approved}</td><td class="num">${m.sentBack}</td><td class="num">${m.rejected}</td><td class="num">${esc(howLong(m.decideHours))}</td></tr>`).join('')}</tbody>
    </table></div>` : '<p class="quiet-box">No managers yet.</p>';
  const people = d.roles.map((r) => `<li><span>${esc(r.label)}</span><strong>${r.active}</strong>${r.inactive ? `<small>+${r.inactive} inactive</small>` : ''}</li>`).join('');
  const active = d.roles.reduce((s, r) => s + r.active, 0);
  const dc = d.discord;
  const [dcValue, dcHint] = dc.kind !== 'discord' ? ['Memory only', "Orders aren't stored in #order-audit, so they're lost when the server stops."]
    : dc.failed ? [plural(dc.failed, 'step'), 'not stored in #order-audit yet.']
    : dc.waiting ? ['On the way', `${plural(dc.waiting, 'step')} being stored in #order-audit.`]
    : ['All stored', 'Every step is in #order-audit.'];
  return `
    ${dashHero({
      label: `Overall performance · ${d.period.label}`,
      value: php(n.sales),
      sub: `${delta(n.sales, p?.sales, php)}<p class="hint">Sales across everyone, less cancelled or rejected orders, and how each person is doing.</p>`,
      body: `<div class="hero-list"><h3 class="label">Salespeople</h3>${sales}</div><div class="hero-list"><h3 class="label">Management</h3>${managers}</div>`,
    })}
    <div class="dash-cards">
      ${dashCard({ label: 'Orders raised', value: whole(n.raised), sub: `${delta(n.raised, p?.raised, whole)}${spark(running(d.trend.map((b) => b.count)))}` })}
      ${dashCard({ label: 'Delivered', value: php(n.deliveredValue), sub: `<p class="hint">${plural(n.delivered, 'order')} delivered</p>${delta(n.deliveredValue, p?.deliveredValue, php)}` })}
      ${dashCard({ label: 'People', tag: 'Now', value: whole(active), sub: `<ul class="people-mini">${people}</ul>`, foot: '<button type="button" class="link" data-go-tab="people">Manage people</button>' })}
      ${dashCard({ label: 'Discord storage', tag: 'Now', value: dcValue, sub: `<p class="hint">${esc(dcHint)}</p>`, foot: dc.failed ? '<button type="button" class="link" data-go-tab="discord">See which</button>' : '' })}
    </div>`;
}

function dashboardHtml(d) {
  const periods = Object.entries(d.periods).map(([key, label]) => `<button type="button" class="seg-btn" data-period="${esc(key)}" aria-pressed="${key === d.period.key}">${esc(label)}</button>`).join('');
  const body = { salesperson: salespersonDash, management: managementDash, finance: financeDash, admin: adminDash }[d.role](d);
  return `<div class="dash">
      <div class="dash-bar">
        <div class="seg-group" role="group" aria-label="Period">${periods}</div>
        <p class="hint" id="dash-at">${esc(updatedText(d))}</p>
      </div>
      ${body}
    </div>`;
}

function renderDashboard() {
  if (!$('#main .dash')) {
    const cached = S.dash.data?.period.key === S.dash.period ? S.dash.data : null;
    $('#main').innerHTML = cached ? dashboardHtml(cached) : '<div class="dash"><p class="hint">Loading the dashboard…</p></div>';
  }
  loadDashboard();
}

// Fetches the figures and redraws. While it fetches, the last figures stay, dimmed, so nothing
// flashes; figures that didn't change aren't redrawn, so an open table or a focused bar stays put.
async function loadDashboard() {
  const period = S.dash.period;
  $('#main .dash')?.classList.add('loading');
  try {
    const data = await api('GET', `/api/orders/dashboard?period=${encodeURIComponent(period)}`);
    if (period !== S.dash.period || currentTab().key !== 'dashboard') return;
    const unchanged = S.dash.data && JSON.stringify({ ...S.dash.data, at: null }) === JSON.stringify({ ...data, at: null });
    S.dash.data = data;
    const shown = $('#main .dash');
    if (unchanged && shown?.querySelector('.dash-hero')) {
      shown.classList.remove('loading');
      $('#dash-at').textContent = updatedText(data);
      return;
    }
    hideTip();
    $('#main').innerHTML = dashboardHtml(data);
  } catch (err) {
    if (err instanceof SignedOut) return;
    $('#main .dash')?.classList.remove('loading');
    toast(err.message, 'bad');
  }
}

// One tooltip for every chart mark: the value first, then what it is. Filled with textContent.
function showTip(el) {
  const tip = $('#viz-tip');
  const value = document.createElement('strong');
  value.textContent = el.dataset.tipValue;
  const label = document.createElement('span');
  label.textContent = el.dataset.tipLabel;
  tip.replaceChildren(value, label);
  tip.hidden = false;
  const box = (el.querySelector('span') ?? el).getBoundingClientRect();
  tip.style.left = `${Math.min(innerWidth - tip.offsetWidth - 8, Math.max(8, box.left + box.width / 2 - tip.offsetWidth / 2))}px`;
  tip.style.top = `${Math.max(8, box.top - tip.offsetHeight - 8)}px`;
}

function hideTip() {
  $('#viz-tip').hidden = true;
}

for (const type of ['pointerover', 'focusin']) {
  $('#main').addEventListener(type, (e) => {
    const el = e.target.closest('[data-tip-value]');
    if (el) showTip(el);
  });
}
for (const type of ['pointerout', 'focusout']) {
  $('#main').addEventListener(type, (e) => {
    if (e.target.closest('[data-tip-value]')) hideTip();
  });
}
addEventListener('scroll', hideTip, { passive: true });

$('#main').addEventListener('click', (e) => {
  const period = e.target.closest('[data-period]');
  if (period) {
    S.dash.period = period.dataset.period;
    for (const b of document.querySelectorAll('[data-period]')) b.setAttribute('aria-pressed', String(b === period));
    loadDashboard();
    return;
  }
  const go = e.target.closest('[data-go-tab]');
  if (go) {
    S.tab = go.dataset.goTab;
    renderMain();
  }
});

// ---------- who a new order is for ----------

// Before a new order: for me, it's yours. For a salesperson, it's theirs, and whoever raised it
// still sees it and can fix it if Management sends it back.
async function askWhoFor() {
  let salespeople;
  try {
    ({ salespeople } = await api('GET', '/api/orders/owners'));
  } catch (err) {
    if (!(err instanceof SignedOut)) toast(err.message, 'bad');
    return;
  }
  const d = $('#for-dialog');
  if (d.open) return;   // a second click while the list was loading
  const picked = S.orderFor?.id;
  const options = salespeople.map((u) => `<option value="${u.id}"${u.id === picked ? ' selected' : ''}>${esc(u.name)}</option>`).join('');
  d.innerHTML = `<form id="for-form" novalidate>
      <h2 class="title" id="for-title">Who is this order for?</h2>
      <label class="for-choice"><input type="radio" name="for" value="me"${picked ? '' : ' checked'}>
        <span><b>For me</b><small>The order is yours.</small></span></label>
      <label class="for-choice"><input type="radio" name="for" value="other"${picked ? ' checked' : ''}${salespeople.length ? '' : ' disabled'}>
        <span><b>For a salesperson</b><small>${salespeople.length ? "It's theirs. You still see it, and either of you can fix it if Management sends it back." : 'There are no other active salespeople to pick.'}</small></span></label>
      <label class="field" for="for-person" id="for-person-field"${picked ? '' : ' hidden'}><span>Salesperson</span>
        <select id="for-person" name="person"><option value="">Choose…</option>${options}</select></label>
      <p class="error" id="for-error" role="alert" hidden></p>
      <div class="actions">
        <button type="submit" class="btn">Continue</button>
        <button type="button" class="btn quiet" data-cancel>Cancel</button>
      </div>
    </form>`;
  d.showModal();
}

const forLine = () => `<p class="for-line" id="for-line">For <strong>${S.orderFor ? esc(S.orderFor.name) : 'you'}</strong> <button type="button" class="link" data-change-for>Change</button></p>`;

$('#new-order').addEventListener('click', () => {
  openNewOrderPage();
});

$('#for-dialog').addEventListener('change', (e) => {
  if (e.target.name === 'for') $('#for-person-field').hidden = e.target.value !== 'other';
});

$('#for-dialog').addEventListener('click', (e) => {
  // Cancel, or a click on the dimmed page around the box.
  if (e.target === e.currentTarget || e.target.closest('[data-cancel]')) e.currentTarget.close();
});

$('#for-dialog').addEventListener('submit', (e) => {
  e.preventDefault();
  const { elements } = e.target;
  if (elements.for.value === 'other') {
    const select = elements.person;
    if (!select.value) {
      $('#for-error').textContent = 'Pick the salesperson this order is for.';
      $('#for-error').hidden = false;
      return select.focus();
    }
    S.orderFor = { id: Number(select.value), name: select.selectedOptions[0].textContent };
  } else {
    S.orderFor = null;
  }
  $('#for-dialog').close();
  if (S.page === 'new' && $('#for-line')) $('#for-line').outerHTML = forLine();   // keeps what's typed
  else openNewOrderPage();
});

function openNewOrderPage() {
  if (!CREATORS.includes(S.user?.role)) return;
  S.page = 'new';
  S.side = null;
  S.openId = null;
  S.order = null;
  history.replaceState(null, '', location.pathname === '/new-order' ? '/new-order' : '#new');
  layout();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function closeNewOrderPage() {
  S.page = null;
  S.staged = [];
  S.orderFor = null;
  history.replaceState(null, '', location.pathname === '/new-order' ? '/app' : location.pathname + location.search);
  layout();
}

window.addEventListener('hashchange', () => {
  const h = decodeURIComponent(location.hash.slice(1));
  if (h === 'new') openNewOrderPage();
  else if (/^(?:GM|ORD)-\d{8}-\d{4}$/.test(h)) openOrder(h);
  else if (!h && S.page === 'new') closeNewOrderPage();
});

// ---------- the open order ----------

async function openOrder(id) {
  S.page = null;
  S.side = 'order';
  S.openId = id;
  S.formFor = null;
  if (S.order?.id !== id) {
    S.order = null;
    $('#side').innerHTML = '<p class="hint">Opening…</p>';
  }
  history.replaceState(null, '', `#${id}`);
  layout();
  try {
    const { order } = await api('GET', `/api/orders/${encodeURIComponent(id)}`);
    if (S.openId !== id) return;
    S.order = order;
    renderSide();
    $('#side').scrollTop = 0;
    if (window.matchMedia('(max-width: 1040px)').matches) window.scrollTo({ top: $('#work').offsetTop - 12 });
    schedule();
  } catch (err) {
    if (err instanceof SignedOut) return;
    toast(err.message, 'bad');
    closeSide();
  }
}

function closeSide() {
  Object.assign(S, { side: null, openId: null, order: null, formFor: null });
  history.replaceState(null, '', location.pathname + location.search);
  layout();
}

async function openForm(kind) {
  if (kind === 'new') return openNewOrderPage();
  // Admin's edit can move the order to another salesperson, picked from the People list.
  if (kind === 'edit' && S.user.role === 'admin' && !S.people) {
    try {
      S.people = await api('GET', '/api/users');
    } catch (err) {
      if (!(err instanceof SignedOut)) toast(err.message, 'bad');
      return;
    }
  }
  S.page = null;
  S.side = kind;
  S.formFor = null;
  if (kind === 'new') {
    S.openId = null;
    S.order = null;
    history.replaceState(null, '', location.pathname + location.search);
  }
  layout();
  renderSide();
  $('#side').scrollTop = 0;
  $('#side [name=customerName]')?.focus();
}

function renderSide() {
  const side = $('#side');
  if (S.side === 'order' && S.order) side.innerHTML = orderView(S.order);
  else if (S.side === 'new') side.innerHTML = orderForm(null, 'new');
  else if ((S.side === 'resubmit' || S.side === 'edit') && S.order) side.innerHTML = orderForm(S.order, S.side);
  if (S.side !== 'order') recalc();
}

const dl = (rows) => `<dl class="facts">${rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>`;

function route(o) {
  // A cancelled or deleted order shows how far it got before it stopped.
  let base = o.status;
  for (let i = o.events.length - 1; (base === 'cancelled' || base === 'deleted') && i >= 0; i--) base = o.events[i].from ?? 'pending_approval';
  const reached = REACHED[base] ?? 0;
  const halt = { cancelled: 'Cancelled', rejected: 'Rejected', deleted: 'Deleted' }[o.status];
  const flag = { returned: 'Sent back', on_hold: 'On hold' }[o.status];
  return `<ol class="route" aria-label="Where this order is">${ROUTE.map((s, i) => {
    let cls = '';
    let note = '';
    let title = '';
    if (i < reached) {
      const ev = s.type === 'created' ? o.events[0] : o.events.findLast((e) => e.type === s.type);
      cls = 'done';
      note = ev ? `${ev.actor.name.split(' ')[0]} · ${brief(ev.at)}` : '';
      title = ev ? `${ev.actor.name}, ${stamp(ev.at)}` : '';
    } else if (i === reached) {
      if (halt) {
        cls = 'halt';
        note = halt;
      } else {
        cls = flag ? 'now flag' : 'now';
        note = flag ?? (o.waitingOn ? `With ${o.waitingOn}` : 'Next');
      }
    }
    return `<li class="stn ${cls}"${title ? ` title="${esc(title)}"` : ''}><span class="dot" aria-hidden="true"></span><b>${esc(s.label)}</b>${note ? `<small>${esc(note)}</small>` : ''}</li>`;
  }).join('')}</ol>`;
}

function orderView(o) {
  const facts = [
    ['Customer', o.customerName],
    ['Contact number', o.contactNumber],
    ['Delivery address', o.address],
    ['Receiver', [o.receiverName, o.receiverContact].filter(Boolean).join(' · ')],
    ['Division', o.division],
    ['Sub-division', o.subDivision],
    ['Head quarter', o.headQuarter],
    ['Invoicing from', o.invoicingFrom],
    ['Source', o.source],
    ['Payment method', o.paymentMethod],
    ['Payment terms', o.paymentTerms],
    ['Delivery method', o.deliveryMethod],
    ['Customer is the doctor', o.customerIsDoctor],
    ['Doctor', o.doctorName],
    ['Customer remarks', o.remarks],
    ['Notes', o.notes],
  ].filter(([, v]) => v);
  const pay = o.payment && [
    ['Paid by', o.payment.method],
    ['Reference number', o.payment.reference],
    ['Amount received', peso(o.payment.amount)],
    ['Paid on', day(o.payment.paidOn)],
    ['Verified by', `${o.payment.verifiedBy}, ${stamp(o.payment.verifiedAt)}`],
  ];
  const short = o.payment && Math.abs(o.payment.amount - o.total) >= 0.01;
  const ship = o.shipment && [
    ['Courier', o.shipment.courier],
    ['Tracking number', o.shipment.trackingNumber],
    ['Dispatched', o.shipment.dispatchedAt && stamp(o.shipment.dispatchedAt)],
    ['Received by', o.shipment.receivedBy],
    ['Delivered', o.shipment.deliveredAt && stamp(o.shipment.deliveredAt)],
  ].filter(([, v]) => v);
  return `
    <div class="side-head">
      <button type="button" class="link" data-close>Back to the list</button>
      <div class="side-top"><h2 class="order-id">${esc(o.id)}</h2>${pill(o.status, o.statusLabel)}</div>
      <p class="sub">Raised by ${esc(o.createdBy.name)}${o.owner && o.owner.id !== o.createdBy.id ? ` for ${esc(o.owner.name)}` : ''}, ${esc(stamp(o.createdAt))}${o.waitingOn ? ` · Next: <strong>${esc(o.waitingOn)}</strong>` : ''}</p>
    </div>
    <div class="route-wrap">${route(o)}</div>
    ${stepBox(o)}
    <section class="block"><h3 class="label">Order</h3>${dl(facts)}</section>
    <section class="block"><h3 class="label">Items</h3>${itemsTable(o)}</section>
    ${o.attachments?.length ? `<section class="block"><h3 class="label">Attachments</h3>${filesList(o)}</section>` : ''}
    ${pay ? `<section class="block"><h3 class="label">Payment</h3>${dl(pay)}${short ? `<p class="warn">The amount received differs from the order total of ${peso(o.total)}.</p>` : ''}</section>` : ''}
    ${ship?.length ? `<section class="block"><h3 class="label">Shipment</h3>${dl(ship)}</section>` : ''}
    <section class="block" id="audit">${auditView(o)}</section>`;
}

function itemsTable(o) {
  return `<div class="table-wrap"><table class="items">
    <thead><tr><th>Product</th><th class="num">Qty</th><th class="num">Unit price</th><th class="num">Amount</th></tr></thead>
    <tbody>${o.items.map((it) => `<tr><td>${esc(it.product)}</td><td class="num">${it.qty}</td><td class="num">${peso(it.unitPrice)}</td><td class="num">${peso(it.qty * it.unitPrice)}</td></tr>`).join('')}</tbody>
    <tfoot><tr><td colspan="3">Total</td><td class="num">${peso(o.total)}</td></tr></tfoot>
  </table></div>`;
}

function stepBox(o) {
  if (!o.actions.length) {
    const text = DONE.has(o.status)
      ? `This order is ${o.statusLabel.toLowerCase()}. Nothing more to do.`
      : `Nothing for you to do on this order right now.${o.waitingOn ? ` It's with ${o.waitingOn}.` : ''}`;
    return `<p class="quiet-box">${esc(text)}</p>`;
  }
  const open = o.actions.find((a) => a.name === S.formFor);
  const primary = o.actions.find((a) => !a.danger);
  const buttons = o.actions.map((a) => {
    const cls = a.danger ? 'btn danger quiet' : a === primary ? 'btn' : 'btn quiet';
    return `<button type="button" class="${cls}" data-action="${esc(a.name)}"${a.form ? ` data-form="${esc(a.form)}"` : ''}>${esc(a.label)}</button>`;
  }).join('');
  return `<section class="step" aria-label="Your step"><h3 class="label">Your step</h3>${open ? actionForm(o, open) : `<div class="actions">${buttons}</div>`}</section>`;
}

// ctx: the order being edited, for suggestions that follow another field (Sub-division follows
// Division).
function fieldHtml(f, value, id, placeholder, name = f.name, ctx = null) {
  const v = value ?? '';
  const req = f.required ? ' required' : '';
  const ph = placeholder ? ` placeholder="${esc(placeholder)}"` : '';
  const optional = f.required ? '' : ' <em>optional</em>';
  const help = f.help ? `<small class="help">${esc(f.help)}</small>` : '';
  if (f.type === 'choice') {   // Yes / No: one tap
    const choices = f.options.map((opt) => `<label><input type="radio" name="${name}" value="${esc(opt)}"${opt === v ? ' checked' : ''}> ${esc(opt)}</label>`).join('');
    return `<fieldset class="field choice"><legend>${esc(f.label)}${optional}</legend><div class="choices">${choices}</div>${help}</fieldset>`;
  }
  let control;
  const suggestions = f.suggestions ?? (f.suggestionsBy && (f.suggestionsBy.lists[ctx?.[f.suggestionsBy.field]] ?? []));
  if (suggestions) {   // typed, with the usual answers offered as you type
    const by = f.suggestionsBy ? ` data-suggest-by="${esc(f.suggestionsBy.field)}"` : '';
    control = `<input id="${id}" name="${name}" type="text" list="${id}-list"${by} autocomplete="off"${f.max ? ` maxlength="${f.max}"` : ''} value="${esc(v)}"${req}${ph}>`
      + `<datalist id="${id}-list">${suggestions.map((s) => `<option value="${esc(s)}">`).join('')}</datalist>`;
  } else if (f.type === 'select') {
    const list = f.optionsBy ? (f.optionsBy.lists[ctx?.[f.optionsBy.field] ?? 'B2C'] ?? f.options) : f.options;
    const by = f.optionsBy ? ` data-options-by="${esc(f.optionsBy.field)}"` : '';
    // Also for a value that's no longer on the list, so the first option isn't picked silently.
    const choose = list.includes(v) ? '' : '<option value="">Choose…</option>';
    control = `<select id="${id}" name="${name}"${by}${req}>${choose}${list.map((opt) => `<option${opt === v ? ' selected' : ''}>${esc(opt)}</option>`).join('')}</select>`;
  } else if (f.type === 'textarea') {
    control = `<textarea id="${id}" name="${name}" maxlength="${f.max}" rows="3"${req}${ph}>${esc(v)}</textarea>`;
  } else if (f.type === 'number') {
    control = `<input id="${id}" name="${name}" type="number" step="0.01" min="${f.min}" inputmode="decimal" value="${esc(v)}"${req}${ph}>`;
  } else {
    control = `<input id="${id}" name="${name}" type="${f.type}"${f.max ? ` maxlength="${f.max}"` : ''} value="${esc(v)}"${req}${ph}>`;
  }
  return `<label class="field${f.type === 'textarea' ? ' wide' : ''}" for="${id}"><span>${esc(f.label)}${optional}</span>${control}${help}</label>`;
}

function actionForm(o, a) {
  const defaults = { method: o.paymentMethod, amount: o.total, paidOn: today() };
  const fields = a.fields.length ? `<div class="grid2">${a.fields.map((f) => fieldHtml(f, defaults[f.name], `act-${f.name}`)).join('')}</div>` : '';
  return `<form id="action-form" data-action="${esc(a.name)}" novalidate>
    <p class="hint">Moves ${esc(o.id)} to <strong>${esc(a.to)}</strong>. The audit trail records it as you, now.</p>
    ${fields}
    <p class="error" id="action-error" role="alert" hidden></p>
    <div class="actions">
      <button type="submit" class="btn${a.danger ? ' danger' : ''}">${esc(a.label)}</button>
      <button type="button" class="btn quiet" data-back>Back</button>
    </div>
  </form>`;
}

function findCatalogProduct(query) {
  if (!S.meta?.products || !query) return null;
  const q = String(query).trim().toLowerCase();
  return S.meta.products.find((p) =>
    (p.id && p.id.toLowerCase() === q) ||
    (p.fullName && p.fullName.toLowerCase() === q) ||
    (p.brandName && p.brandName.toLowerCase() === q) ||
    (p.genericName && p.genericName.toLowerCase() === q)
  ) || null;
}

function getAllowedTiersForDivision(division, hasPrescription = false) {
  const rule = S.meta?.divisionRules?.[division];
  const allTiers = S.meta?.priceTiers || {};
  if (!rule) return [];
  let keys;
  if (division === 'B2C') {
    keys = hasPrescription ? ['doctor'] : ['patient', 'srp'];
  } else {
    keys = rule.allowed || [];
  }
  return keys.map((k) => allTiers[k]).filter(Boolean);
}

function itemRow(it = { product: '', qty: 1, unitPrice: '', priceType: '', unitType: 'unit' }, division = null) {
  const div = division || document.querySelector('#order-form [name=division]')?.value || 'B2C';
  const p = findCatalogProduct(it.product);
  const hasPrescription = S.staged?.some((f) => f.kind === 'prescription') || false;
  const tiers = getAllowedTiersForDivision(div, hasPrescription);

  let selectedTier = it.priceType;
  if (!selectedTier || !tiers.some((t) => t.key === selectedTier)) {
    if (div === 'BID') selectedTier = 'bid';
    else if (div === 'B2B') selectedTier = 'srp';
    else if (div === 'HOS') selectedTier = 'hospital';
    else selectedTier = 'patient';
  }

  const tierOptions = tiers.map((t) => `<option value="${t.key}"${t.key === selectedTier ? ' selected' : ''}>${esc(t.label)}</option>`).join('');
  const unitType = it.unitType || 'unit';

  let hintBadges = [];
  if (p) {
    if (p.classification) hintBadges.push(`<span class="badge info-badge">${esc(p.classification)}</span>`);

    if (p.packSize) hintBadges.push(`<span class="badge">${esc(p.packSize)}</span>`);
    if (p.tax) hintBadges.push(`<span class="badge">${esc(p.tax)}</span>`);

function updateItemRowPrice(row) {
  const form = row.closest('form');
  const div = form?.querySelector('[name=division]')?.value || 'B2C';
  const prodInput = row.querySelector('[name=product]');
  const tierSelect = row.querySelector('[name=priceType]');
  const unitSelect = row.querySelector('[name=unitType]');
  const priceInput = row.querySelector('[name=unitPrice]');
  const hintEl = row.querySelector('.ih');

  const p = findCatalogProduct(prodInput?.value);
  const tier = tierSelect?.value;
  const unitType = unitSelect?.value || 'unit';

  if (p) {
    row.dataset.productId = p.id;
    if (tier !== 'special' && tier !== 'government' && tier !== 'bid') {
      const priceObj = p.prices?.[tier];
      const val = unitType === 'pack' ? priceObj?.packPrice : priceObj?.unitPrice;
      if (val != null && !Number.isNaN(Number(val))) {
        priceInput.value = val;
      }
    }
  }

  let badges = [];
  if (p) {
    if (p.classification) badges.push(`<span class="badge info-badge">${esc(p.classification)}</span>`);
    if (p.dosageStrength) badges.push(`<span class="badge">${esc(p.dosageStrength)}</span>`);
    if (p.packSize) badges.push(`<span class="badge">${esc(p.packSize)}</span>`);
    if (p.tax) badges.push(`<span class="badge">${esc(p.tax)}</span>`);
    const tierNote = p.prices?.[tier]?.note;
    if (tierNote) badges.push(`<span class="badge warn-badge">Note: ${esc(tierNote)}</span>`);
  }
  const hasPrescription = S.staged?.some((f) => f.kind === 'prescription');
  if (tier === 'special' || tier === 'government' || div === 'BID') {
    badges.push(`<span class="badge warn-badge">⚠️ Notes required</span>`);
  } else if (div === 'B2C' && tier === 'doctor' && !hasPrescription) {
    badges.push(`<span class="badge warn-badge">⚠️ Prescription / Rx attachment required</span>`);
  }
  if (hintEl) hintEl.innerHTML = badges.join(' ');
}

function refreshFormDivision(form) {
  const div = form.querySelector('[name=division]')?.value || 'B2C';
  const hasPrescription = S.staged?.some((f) => f.kind === 'prescription');
  const allowed = getAllowedTiersForDivision(div, hasPrescription);

  const subSelect = form.querySelector('[name=subDivision]');
  const lists = S.meta?.fields?.subDivision?.optionsBy?.lists || S.meta?.fields?.subDivision?.suggestionsBy?.lists || {};
  const opts = lists[div] ?? [];
  if (subSelect) {
    if (subSelect.tagName === 'SELECT') {
      const curVal = subSelect.value;
      subSelect.innerHTML = (opts.includes(curVal) ? '' : '<option value="">Choose…</option>') +
        opts.map((s) => `<option value="${esc(s)}"${s === curVal ? ' selected' : ''}>${esc(s)}</option>`).join('');
      if (opts.length === 1) {
        subSelect.value = opts[0];
      } else if (opts.includes(curVal)) {
        subSelect.value = curVal;
      } else {
        subSelect.value = opts[0] ?? '';
      }
    } else {
      const defaultSub = opts[0];
      if (defaultSub && (!subSelect.value || Object.values(lists).flat().includes(subSelect.value))) {
        subSelect.value = defaultSub;
      }
    }
  }

  for (const row of form.querySelectorAll('.item-row')) {
    const tierSelect = row.querySelector('[name=priceType]');
    if (!tierSelect) continue;
    const curTier = tierSelect.value;
    tierSelect.innerHTML = allowed.map((t) => `<option value="${t.key}"${t.key === curTier ? ' selected' : ''}>${esc(t.label)}</option>`).join('');
    if (!allowed.some((t) => t.key === curTier)) {
      if (div === 'BID') tierSelect.value = 'bid';
      else if (div === 'B2B') tierSelect.value = 'srp';
      else if (div === 'HOS') tierSelect.value = 'hospital';
      else tierSelect.value = 'patient';
    }
    updateItemRowPrice(row);
  }
  recalc();
  refreshFiles();
}

function recalc() {
  const rows = document.querySelectorAll('#item-rows .item-row');
  let total = 0;
  for (const row of rows) {
    const amount = (Number(row.querySelector('[name=qty]').value) || 0) * (Number(row.querySelector('[name=unitPrice]').value) || 0);
    total += amount;
    row.querySelector('.line-amt').textContent = peso(amount);
    row.querySelector('[data-remove-item]').disabled = rows.length === 1;
  }
  const t = $('#form-total');
  if (t) t.textContent = peso(total);
}
