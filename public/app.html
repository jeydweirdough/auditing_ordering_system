<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orders · record_database</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ground: #E7EBF0;
    --surface: #FFFFFF;
    --sunk: #F4F6F9;
    --ink: #152033;
    --ink-2: #536076;
    --ink-3: #98A3B3;
    --line: #CFD7E1;
    --line-soft: #E9EDF2;
    --field: #C4CDD9;
    --lane: #DCE2EA;

    --navy: #1F3864;          /* the embed colour in Discord */
    --navy-deep: #152848;
    --navy-tint: #E2E8F3;
    --held: #A8520A;
    --held-tint: #FCEFD9;
    --ok: #16753A;
    --ok-tint: #DFF2E5;
    --bad: #B42318;
    --bad-tint: #FCE5E2;
    --blurple: #4752C4;
    --blurple-tint: #E8EAFC;

    --sans: "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  }

  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { color-scheme: light; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font: 400 15px/1.5 var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, p { margin: 0; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  .wrap {
    max-width: 1320px;
    margin: 0 auto;
    padding-inline: clamp(16px, 3vw, 36px);
    padding-block: 22px 72px;
  }
  .eyebrow { margin-bottom: 6px; font: 500 12.5px var(--mono); color: var(--ink-2); }
  h1 {
    font: 800 clamp(2.2rem, 5vw, 3.2rem)/.92 var(--sans);
    font-stretch: 62%;
    text-transform: uppercase;
    color: var(--navy);
  }
  .label {
    font: 700 12px/1.2 var(--sans);
    font-stretch: 72%;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--ink);
  }
  .title { font: 700 1.35rem/1.15 var(--sans); font-stretch: 85%; text-wrap: balance; }
  .hint { color: var(--ink-2); font-size: 13.5px; }
  .sub { color: var(--ink-2); font-size: 13.5px; }
  .mono { font-family: var(--mono); }

  /* ---------- buttons ---------- */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-height: 38px;
    padding: 7px 15px;
    border: 1px solid var(--navy);
    border-radius: 6px;
    background: var(--navy);
    color: #fff;
    font-weight: 600;
    font-size: 14.5px;
    line-height: 1.2;
    text-align: center;
  }
  .btn:hover { background: var(--navy-deep); border-color: var(--navy-deep); }
  .btn.quiet { background: var(--surface); color: var(--navy); border-color: var(--line); }
  .btn.quiet:hover { border-color: var(--navy); }
  .btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
  .btn.danger.quiet { background: var(--surface); color: var(--bad); border-color: #EBC1BC; }
  .btn.danger.quiet:hover { border-color: var(--bad); }
  .btn.small { min-height: 30px; padding: 4px 10px; font-size: 13px; }
  .btn:disabled { opacity: .55; cursor: progress; }
  .link {
    justify-self: start;
    padding: 0;
    border: 0;
    background: none;
    color: var(--navy);
    font-weight: 600;
    font-size: 13.5px;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }

  /* ---------- fields ---------- */
  .field { display: grid; gap: 5px; min-width: 0; align-content: start; }
  .field > span {
    font: 600 11.5px/1.2 var(--sans);
    font-stretch: 72%;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--ink-2);
  }
  .field em { font-style: normal; font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--ink-3); }
  .field input, .field select, .field textarea {
    width: 100%;
    min-height: 38px;
    padding: 7px 10px;
    border: 1px solid var(--field);
    border-radius: 6px;
    background: var(--surface);
    font-size: 15px;
  }
  .field textarea { min-height: 70px; resize: vertical; line-height: 1.45; }
  .field input:focus, .field select:focus, .field textarea:focus {
    border-color: var(--navy);
    outline: 3px solid var(--navy-tint);
    outline-offset: 0;
  }
  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 14px; }
  .grid2 .wide { grid-column: 1 / -1; }
  .grid4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px 14px; }
  @media (max-width: 520px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
  .error {
    padding: 8px 11px;
    border-radius: 6px;
    background: var(--bad-tint);
    color: var(--bad);
    font-weight: 500;
    font-size: 14px;
  }
  .warn {
    padding: 9px 12px;
    border-radius: 6px;
    background: var(--held-tint);
    color: var(--held);
    font-size: 14px;
    overflow-wrap: anywhere;
  }

  /* ---------- sign-in ---------- */
  .login {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding-inline: clamp(16px, 4vw, 48px);
    padding-block: 40px;
  }
  .login-inner {
    width: 100%;
    max-width: 940px;
    display: grid;
    grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr);
    gap: 32px 52px;
    align-items: end;
    padding-bottom: 26px;
    border-bottom: 3px solid var(--navy);
  }
  .login h1 { font-size: clamp(3.4rem, 10vw, 6.4rem); }
  .lede { margin-block: 14px 22px; max-width: 44ch; color: var(--ink-2); font-size: 15.5px; }
  .login-form {
    display: grid;
    gap: 14px;
    padding: 22px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--surface);
  }
  @media (max-width: 760px) { .login-inner { grid-template-columns: minmax(0, 1fr); } }

  /* ---------- the route: an order's seven stations ---------- */
  .route-wrap { overflow-x: auto; padding-block: 4px; }
  .route {
    display: grid;
    grid-template-columns: repeat(7, minmax(66px, 1fr));
    min-width: 462px;
    margin: 0;
    padding: 0;
    list-style: none;
  }
  .stn {
    position: relative;
    display: grid;
    justify-items: center;
    align-content: start;
    gap: 5px;
    padding-inline: 2px;
    text-align: center;
  }
  .stn::before {
    content: "";
    position: absolute;
    top: 10px;
    right: 50%;
    width: 100%;
    height: 2px;
    background: var(--line);
  }
  .stn:first-child::before { display: none; }
  .stn.done::before, .stn.now::before, .stn.halt::before { background: var(--navy); }
  .dot {
    position: relative;
    z-index: 1;
    display: grid;
    place-items: center;
    width: 22px;
    height: 22px;
    border: 2px solid var(--line);
    border-radius: 50%;
    background: var(--surface);
    color: #fff;
    font: 700 15px/1 var(--sans);
  }
  .done .dot { border-color: var(--navy); background: var(--navy); }
  .done .dot::after {
    content: "";
    width: 9px;
    height: 5px;
    margin-top: -2px;
    border-left: 2px solid #fff;
    border-bottom: 2px solid #fff;
    transform: rotate(-45deg);
  }
  .now .dot { border-color: var(--navy); box-shadow: 0 0 0 4px var(--navy-tint); }
  .now .dot::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--navy); }
  .now.flag .dot { border-color: var(--held); box-shadow: 0 0 0 4px var(--held-tint); }
  .now.flag .dot::after { background: var(--held); }
  .halt .dot { border-color: var(--bad); background: var(--bad); }
  .halt .dot::after { content: "×"; margin-top: -2px; }
  .stn b { font: 600 12.5px/1.2 var(--sans); font-stretch: 85%; color: var(--ink-3); }
  .stn.done b, .stn.now b, .stn.halt b { color: var(--ink); }
  .stn small { font-size: 11px; line-height: 1.3; color: var(--ink-2); }
  .now small { color: var(--navy); font-weight: 600; }
  .now.flag small { color: var(--held); }
  .halt small { color: var(--bad); font-weight: 600; }
  /* On a phone the route runs down the page instead of across it. */
  @media (max-width: 560px) {
    .route { grid-template-columns: minmax(0, 1fr); min-width: 0; }
    .stn {
      grid-template-columns: 22px auto minmax(0, 1fr);
      justify-items: start;
      align-items: center;
      gap: 0 10px;
      padding: 0 0 12px;
      text-align: left;
    }
    .stn:last-child { padding-bottom: 0; }
    .stn::before { top: -12px; right: auto; left: 10px; width: 2px; height: 12px; }
    .stn small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  }

  /* ---------- header ---------- */
  .top {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: 14px 32px;
    padding-bottom: 14px;
    border-bottom: 3px solid var(--navy);
  }
  .who { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; }
  .who-name { font-weight: 600; }
  .role {
    padding: 5px 8px 4px;
    border-radius: 4px;
    background: var(--navy);
    color: #fff;
    font: 700 11px/1 var(--sans);
    font-stretch: 72%;
    letter-spacing: .1em;
    text-transform: uppercase;
  }
  .bar {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: 12px 20px;
    margin-block: 18px 16px;
  }
  .bar-left { display: grid; gap: 10px; min-width: 0; }
  .role-line { color: var(--ink-2); }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; }
  .tab {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    min-height: 36px;
    padding: 6px 12px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--surface);
    color: var(--ink-2);
    font-weight: 600;
    font-size: 14px;
  }
  .tab:hover { border-color: var(--navy); color: var(--navy); }
  .tab[aria-selected="true"] { border-color: var(--navy); background: var(--navy); color: #fff; }
  .count {
    padding: 3px 6px;
    border-radius: 4px;
    background: var(--line-soft);
    color: var(--ink-2);
    font: 600 12px/1 var(--mono);
  }
  .count.hot { background: var(--held-tint); color: var(--held); }
  .tab[aria-selected="true"] .count { background: rgba(255, 255, 255, .18); color: #fff; }

  /* ---------- list and detail ---------- */
  .work { display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; align-items: start; }
  .work.split { grid-template-columns: minmax(0, 1fr) minmax(0, 520px); }
  @media (max-width: 1040px) {
    .work.split { grid-template-columns: minmax(0, 1fr); }
    .work.split > .list-col { display: none; }
  }

  .orders { overflow: hidden; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
  .row {
    display: grid;
    grid-template-columns: 158px minmax(0, 1fr) 118px 190px 92px;
    grid-template-areas: "id cust amt st age";
    gap: 4px 14px;
    align-items: center;
    width: 100%;
    padding: 11px 16px;
    border: 0;
    border-top: 1px solid var(--line-soft);
    background: none;
    text-align: left;
  }
  .row:first-child { border-top: 0; }
  button.row:hover { background: var(--sunk); }
  .row[aria-current="true"] { background: var(--navy-tint); box-shadow: inset 3px 0 0 var(--navy); }
  .row.head { padding-block: 9px; background: var(--sunk); }
  .row.head span {
    font: 700 11px/1.2 var(--sans);
    font-stretch: 72%;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--ink-2);
  }
  .id { grid-area: id; font: 500 13px var(--mono); color: var(--navy); }
  .cust { grid-area: cust; min-width: 0; }
  .cust strong, .cust small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cust strong { font-weight: 600; }
  .cust small { color: var(--ink-2); font-size: 13px; }
  .amt { grid-area: amt; text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
  .st { grid-area: st; display: grid; justify-items: start; gap: 3px; }
  .age { grid-area: age; text-align: right; color: var(--ink-2); font-size: 13px; }
  .dcflag { color: var(--bad); font-size: 12px; font-weight: 600; }
  .empty { padding: 30px 18px; color: var(--ink-2); }
  @media (max-width: 760px) {
    .row { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "id st" "cust amt"; }
    .row .age, .row.head { display: none; }
    .st { justify-items: end; }
  }
  /* Beside an open order the list is narrow, so each row takes two lines. */
  .work.split .row { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "id st" "cust amt"; }
  .work.split .row .age, .work.split .row.head { display: none; }
  .work.split .st { justify-items: end; }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 9px 4px;
    border-radius: 4px;
    font: 600 12.5px/1.1 var(--sans);
    white-space: nowrap;
  }
  .pill::before { content: ""; flex: none; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .pill.wait { background: var(--held-tint); color: var(--held); }
  .pill.move { background: var(--navy-tint); color: var(--navy); }
  .pill.ok { background: var(--ok-tint); color: var(--ok); }
  .pill.bad { background: var(--bad-tint); color: var(--bad); }
  .pill.stop { background: var(--line-soft); color: var(--ink-2); }

  /* dispatch board */
  .board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .work.split .board { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  @media (max-width: 900px) { .board { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 520px) { .board, .work.split .board { grid-template-columns: minmax(0, 1fr); } }
  .lane {
    display: grid;
    align-content: start;
    gap: 8px;
    min-height: 150px;
    padding: 10px;
    border-radius: 10px;
    background: var(--lane);
  }
  .lane h3 { display: flex; align-items: center; justify-content: space-between; padding: 2px 2px 4px; }
  .card {
    display: grid;
    gap: 2px;
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--surface);
    text-align: left;
  }
  .card:hover { border-color: var(--navy); }
  .card[aria-current="true"] { border-color: var(--navy); box-shadow: inset 3px 0 0 var(--navy); }
  .card > * { grid-area: auto; }
  .card strong { font-weight: 600; overflow-wrap: anywhere; }
  .card small { color: var(--ink-2); font-size: 12.5px; }
  .lane-empty { padding: 8px 4px; color: var(--ink-2); font-size: 13px; }

  /* the open order */
  .side {
    position: sticky;
    top: 16px;
    display: grid;
    gap: 22px;
    max-height: calc(100vh - 32px);
    overflow: auto;
    padding: 18px 20px 24px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--surface);
  }
  @media (max-width: 1040px) { .side { position: static; max-height: none; overflow: visible; } }
  .side-head { display: grid; gap: 8px; }
  .side-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; }
  .order-id { font: 600 1.35rem/1.2 var(--mono); color: var(--navy); overflow-wrap: anywhere; }
  .block { display: grid; gap: 10px; }
  .facts { display: grid; grid-template-columns: 136px minmax(0, 1fr); gap: 7px 14px; margin: 0; }
  .facts dt { color: var(--ink-2); font-size: 13.5px; }
  .facts dd { margin: 0; overflow-wrap: anywhere; white-space: pre-line; }
  @media (max-width: 420px) { .facts { grid-template-columns: minmax(0, 1fr); gap: 2px; } .facts dd { margin-bottom: 8px; } }
  .table-wrap { overflow-x: auto; }
  .items { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
  .items th {
    padding: 6px 8px;
    border-bottom: 1px solid var(--line);
    text-align: left;
    font: 700 11px/1.2 var(--sans);
    font-stretch: 72%;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--ink-2);
  }
  .items td { padding: 7px 8px; border-bottom: 1px solid var(--line-soft); vertical-align: top; overflow-wrap: anywhere; }
  .items .num { text-align: right; white-space: nowrap; }
  .items tfoot td { border-bottom: 0; font-weight: 700; }

  .step {
    display: grid;
    gap: 12px;
    padding: 14px 16px 16px;
    border: 2px solid var(--navy);
    border-radius: 10px;
    background: #F6F8FC;
  }
  .step form { display: grid; gap: 12px; }
  .quiet-box { padding: 12px 14px; border-radius: 8px; background: var(--sunk); color: var(--ink-2); font-size: 14px; }

  /* audit trail */
  .audit-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
  .trail { display: grid; margin: 4px 0 0; padding: 0; list-style: none; }
  .trail li {
    position: relative;
    display: grid;
    grid-template-columns: 14px minmax(0, 1fr);
    gap: 0 12px;
    padding-bottom: 16px;
  }
  .trail li::before {
    content: "";
    position: absolute;
    top: 18px;
    bottom: 0;
    left: 6px;
    width: 2px;
    background: var(--line);
  }
  .trail li:last-child { padding-bottom: 0; }
  .trail li:last-child::before { display: none; }
  .tick { width: 14px; height: 14px; margin-top: 4px; border: 3px solid var(--navy-tint); border-radius: 50%; background: var(--navy); }
  .tick.bad { border-color: var(--bad-tint); background: var(--bad); }
  .what { font-weight: 600; }
  .change { font-weight: 400; font-size: 13.5px; color: var(--ink-2); }
  .by { font-size: 13px; color: var(--ink-2); }
  .note {
    margin-top: 5px;
    padding: 7px 10px;
    border-radius: 6px;
    background: var(--sunk);
    font-size: 14px;
    white-space: pre-line;
    overflow-wrap: anywhere;
  }
  .details { margin-top: 4px; font-size: 13.5px; overflow-wrap: anywhere; }
  .dc {
    display: inline-block;
    margin-top: 5px;
    padding: 2px 7px;
    border-radius: 4px;
    font: 500 11.5px/1.5 var(--mono);
    overflow-wrap: anywhere;
  }
  .dc.sent { background: var(--blurple-tint); color: var(--blurple); }
  .dc.wait { background: var(--held-tint); color: var(--held); }
  .dc.bad { background: var(--bad-tint); color: var(--bad); }
  .dc.off { background: var(--line-soft); color: var(--ink-2); }

  /* order form */
  .items-edit { display: grid; gap: 10px; min-width: 0; margin: 0; padding: 0; border: 0; }
  .items-edit legend { margin-bottom: 8px; padding: 0; }
  .item-rows { display: grid; gap: 8px; }
  .item-row {
    display: grid;
    grid-template-columns: 74px minmax(0, 1fr) minmax(0, 1fr) 38px;
    grid-template-areas: "p p p p" "q u a r";
    gap: 8px;
    padding: 10px 12px;
    border: 1px solid var(--line-soft);
    border-radius: 8px;
    background: var(--sunk);
  }
  .ip { grid-area: p; }
  .iq { grid-area: q; }
  .iu { grid-area: u; }
  .ia { grid-area: a; }
  .line-amt { display: block; min-height: 38px; padding-top: 8px; text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
  .remove {
    grid-area: r;
    align-self: end;
    width: 38px;
    height: 38px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--surface);
    color: var(--ink-2);
    font-size: 19px;
    line-height: 1;
  }
  .remove:hover { border-color: var(--bad); color: var(--bad); }
  .remove:disabled { opacity: .4; cursor: not-allowed; }
  .items-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
  .items-foot strong { font-size: 17px; font-variant-numeric: tabular-nums; }

  /* people */
  .panel {
    display: grid;
    gap: 18px;
    padding: 18px 20px 22px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--surface);
  }
  .people { width: 100%; min-width: 680px; border-collapse: collapse; font-size: 14px; }
  .people th {
    padding: 8px 10px;
    border-bottom: 1px solid var(--line);
    text-align: left;
    font: 700 11px/1.2 var(--sans);
    font-stretch: 72%;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--ink-2);
  }
  .people td { padding: 9px 10px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
  .people tr.inactive td { color: var(--ink-3); }
  .people select { min-height: 32px; padding: 4px 8px; border: 1px solid var(--field); border-radius: 6px; background: var(--surface); }
  .status-cell { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
  .callout {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 12px;
    padding: 12px 14px;
    border: 1px solid #A6D8B5;
    border-radius: 8px;
    background: var(--ok-tint);
  }
  .callout code {
    padding: 4px 9px;
    border-radius: 4px;
    background: var(--surface);
    font: 600 15px var(--mono);
    user-select: all;
    overflow-wrap: anywhere;
  }
  .person-form { display: grid; gap: 12px; padding-top: 16px; border-top: 1px solid var(--line-soft); }

  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    z-index: 20;
    max-width: calc(100vw - 32px);
    padding: 10px 16px;
    border-radius: 8px;
    background: var(--ink);
    color: #fff;
    font-weight: 500;
    box-shadow: 0 8px 24px rgba(21, 32, 51, .25);
    transform: translateX(-50%);
  }
  .toast.bad { background: var(--bad); }
</style>
</head>
<body>

<main id="login" class="login" hidden>
  <div class="login-inner">
    <div>
      <p class="eyebrow">record_database</p>
      <h1>Orders</h1>
      <p class="lede">Salesperson raises the order. Management approves it, Finance verifies payment, and Dispatch picks, packs and ships it. Each step is recorded with who did it, and when.</p>
      <div class="route-wrap"><ol class="route" id="legend" aria-label="The steps every order goes through"></ol></div>
    </div>
    <form id="login-form" class="login-form" novalidate>
      <label class="field" for="login-email"><span>Email</span><input id="login-email" type="email" autocomplete="username" required></label>
      <label class="field" for="login-password"><span>Password</span><input id="login-password" type="password" autocomplete="current-password" required></label>
      <p class="error" id="login-error" role="alert" hidden></p>
      <button type="submit" class="btn">Sign in</button>
      <p class="hint">No account yet? Admin adds people on the People screen.</p>
    </form>
  </div>
</main>

<div id="app" class="wrap" hidden>
  <header class="top">
    <div>
      <p class="eyebrow">record_database · orders</p>
      <h1>Orders</h1>
    </div>
    <div class="who">
      <span class="who-name" id="who-name"></span>
      <span class="role" id="who-role"></span>
      <button type="button" class="btn quiet small" id="sign-out">Sign out</button>
    </div>
  </header>

  <div class="bar">
    <div class="bar-left">
      <p class="role-line" id="role-line"></p>
      <p class="warn" id="storage-line" hidden></p>
      <nav class="tabs" id="tabs" role="tablist" aria-label="Order lists"></nav>
    </div>
    <button type="button" class="btn" id="new-order" hidden>New order</button>
  </div>

  <div class="work" id="work">
    <div class="list-col" id="main"></div>
    <aside class="side" id="side" aria-label="Order" hidden></aside>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
'use strict';

const $ = (sel, root = document) => root.querySelector(sel);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const TZ = 'Asia/Manila';
const pesoFormat = new Intl.NumberFormat('en-PH', { style: 'currency', currency: 'PHP' });
const peso = (n) => pesoFormat.format(Number(n) || 0);
const stampFormat = new Intl.DateTimeFormat('en-PH', { timeZone: TZ, day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });
const stamp = (iso) => stampFormat.format(new Date(iso));
const dateKey = (d) => new Intl.DateTimeFormat('en-CA', { timeZone: TZ }).format(d);
const briefTime = new Intl.DateTimeFormat('en-PH', { timeZone: TZ, hour: 'numeric', minute: '2-digit' });
const briefDay = new Intl.DateTimeFormat('en-PH', { timeZone: TZ, day: 'numeric', month: 'short' });
// The time if it was today in Manila, otherwise the date: short enough for a route station.
const brief = (iso) => {
  const d = new Date(iso);
  return dateKey(d) === dateKey(new Date()) ? briefTime.format(d) : briefDay.format(d);
};
const dayFormat = new Intl.DateTimeFormat('en-PH', { timeZone: 'UTC', day: 'numeric', month: 'short', year: 'numeric' });
const day = (ymd) => dayFormat.format(new Date(`${ymd}T00:00:00Z`));
const today = () => new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;

function ago(iso) {
  const s = (Date.now() - Date.parse(iso)) / 1000;
  if (s < 60) return 'just now';
  if (s < 3600) return `${Math.floor(s / 60)} min ago`;
  if (s < 86400) return `${Math.floor(s / 3600)} h ago`;
  return stamp(iso);
}

const DONE = new Set(['completed', 'cancelled', 'rejected']);
const IN_DISPATCH = ['ready_for_dispatch', 'picking', 'packed', 'dispatched'];
const TONE = {
  pending_approval: 'wait', returned: 'wait', awaiting_payment: 'wait', on_hold: 'bad',
  ready_for_dispatch: 'move', picking: 'move', packed: 'move', dispatched: 'move',
  completed: 'ok', rejected: 'stop', cancelled: 'stop', deleted: 'stop',
};
const pill = (status, label) => `<span class="pill ${TONE[status] ?? 'stop'}">${esc(label)}</span>`;

const INTRO = {
  salesperson: 'Raise orders, and fix the ones Management sends back.',
  management: 'Approve new orders, send them back for changes, or reject them.',
  finance: 'Verify payment on approved orders, or put them on hold.',
  dispatch: 'Pick, pack and dispatch paid orders, then mark them delivered.',
  admin: 'Create, edit, delete and restore any order, and manage who can sign in. Every change is logged in #order-audit.',
};

// Each role's dashboard. needs: the queue that waits on this role, so its count stands out.
const TABS = {
  salesperson: [
    { key: 'returned', label: 'Sent back to you', needs: true, match: (o) => o.status === 'returned', empty: 'Nothing has been sent back to you.' },
    { key: 'active', label: 'In progress', match: (o) => !DONE.has(o.status) && o.status !== 'returned', empty: 'No orders in progress. Raise one with New order.' },
    { key: 'done', label: 'Finished', match: (o) => DONE.has(o.status), empty: 'No finished orders yet.' },
  ],
  management: [
    { key: 'approval', label: 'Waiting for approval', needs: true, match: (o) => o.status === 'pending_approval', empty: 'Nothing is waiting for approval.' },
    { key: 'active', label: 'In progress', match: (o) => !DONE.has(o.status) && o.status !== 'pending_approval', empty: 'No approved orders are in progress.' },
    { key: 'done', label: 'Finished', match: (o) => DONE.has(o.status), empty: 'No finished orders yet.' },
  ],
  finance: [
    { key: 'payment', label: 'Awaiting payment', needs: true, match: (o) => o.status === 'awaiting_payment', empty: 'No approved orders are waiting for payment.' },
    { key: 'hold', label: 'On hold', needs: true, match: (o) => o.status === 'on_hold', empty: 'No orders are on hold.' },
    { key: 'verified', label: 'Payment verified', match: (o) => [...IN_DISPATCH, 'completed'].includes(o.status), empty: 'No payments verified yet.' },
  ],
  dispatch: [
    { key: 'board', label: 'Dispatch board', needs: true, board: true, match: (o) => IN_DISPATCH.includes(o.status) },
    { key: 'delivered', label: 'Delivered', match: (o) => o.status === 'completed', empty: 'Nothing delivered yet.' },
  ],
  admin: [
    { key: 'all', label: 'All orders', match: (o) => o.status !== 'deleted', empty: 'No orders yet. Raise one with New order.' },
    { key: 'discord', label: 'Not in Discord', needs: true, match: (o) => o.discordProblem, empty: 'Every step is stored in #order-audit.' },
    { key: 'deleted', label: 'Deleted', match: (o) => o.status === 'deleted', empty: 'No deleted orders. Deleting keeps the order and its thread, so it can be restored.' },
    { key: 'people', label: 'People' },
  ],
};

const LANES = [
  ['ready_for_dispatch', 'Ready for dispatch'],
  ['picking', 'Picking'],
  ['packed', 'Packed'],
  ['dispatched', 'Dispatched'],
];

// The seven stations of an order, each completed by one kind of step.
const ROUTE = [
  { type: 'created', label: 'Raised', who: 'Salesperson' },
  { type: 'approve', label: 'Approved', who: 'Management' },
  { type: 'verify_payment', label: 'Payment verified', who: 'Finance' },
  { type: 'start_picking', label: 'Picking', who: 'Dispatch' },
  { type: 'mark_packed', label: 'Packed', who: 'Dispatch' },
  { type: 'dispatch', label: 'Dispatched', who: 'Dispatch' },
  { type: 'deliver', label: 'Delivered', who: 'Dispatch' },
];
const REACHED = {
  pending_approval: 1, returned: 1, rejected: 1, awaiting_payment: 2, on_hold: 2,
  ready_for_dispatch: 3, picking: 4, packed: 5, dispatched: 6, completed: 7,
};
const PLACEHOLDERS = {
  customerName: 'e.g. Sto. Niño Pharmacy',
  contactNumber: 'e.g. 0917 123 4567',
  address: 'Street, barangay, city',
  notes: 'Anything Finance or Dispatch should know',
};

const S = {
  user: null, meta: null, orders: [], tab: null,
  side: null,        // 'order' | 'new' | 'resubmit'
  openId: null, order: null,
  formFor: null,     // the step whose form is open
  people: null, reveal: null, timer: null,
};

// ---------- talking to the server ----------

class SignedOut extends Error {}

async function api(method, url, body) {
  let res;
  try {
    res = await fetch(url, {
      method,
      headers: body === undefined ? {} : { 'Content-Type': 'application/json' },
      body: body === undefined ? undefined : JSON.stringify(body),
    });
  } catch {
    throw new Error("Can't reach the server. Is it running (npm run dev)?");
  }
  const data = await res.json().catch(() => ({}));
  if (res.status === 401 && url !== '/api/auth/login') {
    signedOut(S.user ? 'Your sign-in has ended. Sign in again.' : null);
    throw new SignedOut();
  }
  if (!res.ok) throw new Error(data.error || `The server answered ${res.status}.`);
  return data;
}

function toast(message, kind = '') {
  const t = $('#toast');
  t.textContent = message;
  t.className = `toast ${kind}`;
  t.hidden = false;
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => { t.hidden = true; }, 4500);
}

// ---------- signing in and out ----------

function signedOut(message) {
  clearTimeout(S.timer);
  Object.assign(S, { user: null, meta: null, orders: [], tab: null, side: null, openId: null, order: null, formFor: null, people: null, reveal: null });
  $('#app').hidden = true;
  $('#login').hidden = false;
  document.title = 'Orders · record_database';
  const err = $('#login-error');
  err.textContent = message ?? '';
  err.hidden = !message;
  $('#login-email').focus();
}

async function enter(user) {
  S.user = user;
  S.meta = await api('GET', '/api/orders/meta');
  $('#login').hidden = true;
  $('#app').hidden = false;
  $('#who-name').textContent = user.name;
  $('#who-role').textContent = user.roleLabel;
  $('#role-line').textContent = INTRO[user.role];
  const store = S.meta.storage;
  const storageNote = store.error
    ? `Orders couldn't be read from #order-audit, so new orders are refused until that's fixed and the server restarts. ${store.error}`
    : store.kind !== 'discord' ? "Orders are kept in memory only and are lost when the server stops. They're stored in Discord in live mode with the bot's token." : '';
  $('#storage-line').textContent = storageNote;
  $('#storage-line').hidden = !storageNote;
  $('#new-order').hidden = !['salesperson', 'admin'].includes(user.role);
  document.title = `${user.roleLabel} · Orders`;
  await loadOrders();
  const wanted = decodeURIComponent(location.hash.slice(1));
  if (/^ORD-\d{8}-\d{4}$/.test(wanted)) openOrder(wanted);
  else layout();
  schedule();
}

$('#login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = e.target.querySelector('[type=submit]');
  const err = $('#login-error');
  btn.disabled = true;
  err.hidden = true;
  try {
    const { user } = await api('POST', '/api/auth/login', { email: $('#login-email').value, password: $('#login-password').value });
    $('#login-password').value = '';
    await enter(user);
  } catch (error) {
    if (!(error instanceof SignedOut)) {
      err.textContent = error.message;
      err.hidden = false;
    }
  } finally {
    btn.disabled = false;
  }
});

$('#sign-out').addEventListener('click', async () => {
  try { await api('POST', '/api/auth/logout', {}); } catch { /* signed out either way */ }
  signedOut(null);
});

// ---------- the dashboard ----------

const currentTab = () => TABS[S.user.role].find((t) => t.key === S.tab) ?? TABS[S.user.role][0];

function renderTabs() {
  const tabs = TABS[S.user.role];
  if (!tabs.some((t) => t.key === S.tab)) S.tab = (tabs.find((t) => t.match && S.orders.some(t.match)) ?? tabs[0]).key;
  $('#tabs').innerHTML = tabs.map((t) => {
    const n = t.match ? S.orders.filter(t.match).length : null;
    const on = t.key === S.tab;
    const count = n === null ? '' : `<span class="count${t.needs && n && !on ? ' hot' : ''}">${n}</span>`;
    return `<button type="button" class="tab" role="tab" aria-selected="${on}" data-tab="${t.key}">${esc(t.label)}${count}</button>`;
  }).join('');
}

function renderMain() {
  renderTabs();
  const tab = currentTab();
  if (tab.key === 'people') {
    if (!$('#people-panel')) {
      $('#main').innerHTML = '<div class="panel" id="people-panel"><p class="hint">Loading people…</p></div>';
      renderPeople();
    }
    return;
  }
  const list = S.orders.filter(tab.match);
  $('#main').innerHTML = tab.board ? board(list) : table(list, tab.empty);
}

function layout() {
  $('#work').classList.toggle('split', Boolean(S.side));
  $('#side').hidden = !S.side;
  renderMain();
}

async function loadOrders() {
  const { orders } = await api('GET', '/api/orders');
  S.orders = orders;
  renderMain();
}

function table(list, empty) {
  if (!list.length) return `<div class="orders"><p class="empty">${esc(empty)}</p></div>`;
  const showOwner = S.user.role !== 'salesperson';
  const rows = list.map((o) => `
    <button type="button" class="row" data-open="${esc(o.id)}" aria-current="${o.id === S.openId}">
      <span class="id">${esc(o.id)}</span>
      <span class="cust"><strong>${esc(o.customerName)}</strong><small>${esc(o.division)} · ${plural(o.items, 'item')}${showOwner ? ` · by ${esc(o.owner)}` : ''}</small></span>
      <span class="amt">${peso(o.total)}</span>
      <span class="st">${pill(o.status, o.statusLabel)}${o.discordProblem ? '<small class="dcflag">Not in Discord</small>' : ''}</span>
      <span class="age">${esc(ago(o.updatedAt))}</span>
    </button>`).join('');
  return `<div class="orders">
    <div class="row head" aria-hidden="true"><span class="id">Order</span><span class="cust">Customer</span><span class="amt">Total</span><span class="st">Status</span><span class="age">Updated</span></div>
    ${rows}
  </div>`;
}

function board(list) {
  return `<div class="board">${LANES.map(([status, label]) => {
    const cards = list.filter((o) => o.status === status);
    const body = cards.map((o) => `
      <button type="button" class="card" data-open="${esc(o.id)}" aria-current="${o.id === S.openId}">
        <span class="id">${esc(o.id)}</span>
        <strong>${esc(o.customerName)}</strong>
        <small>${esc(o.division)} · ${plural(o.items, 'item')}</small>
        <small>${esc(ago(o.updatedAt))}${o.discordProblem ? ' · <span class="dcflag">Not in Discord</span>' : ''}</small>
      </button>`).join('');
    return `<section class="lane"><h3 class="label"><span>${esc(label)}</span><span class="count">${cards.length}</span></h3>${body || '<p class="lane-empty">Nothing here.</p>'}</section>`;
  }).join('')}</div>`;
}

$('#tabs').addEventListener('click', (e) => {
  const t = e.target.closest('[data-tab]');
  if (!t) return;
  S.tab = t.dataset.tab;
  renderMain();
});

$('#new-order').addEventListener('click', () => openForm('new'));

// ---------- the open order ----------

async function openOrder(id) {
  S.side = 'order';
  S.openId = id;
  S.formFor = null;
  if (S.order?.id !== id) {
    S.order = null;
    $('#side').innerHTML = '<p class="hint">Opening…</p>';
  }
  history.replaceState(null, '', `#${id}`);
  layout();
  try {
    const { order } = await api('GET', `/api/orders/${encodeURIComponent(id)}`);
    if (S.openId !== id) return;
    S.order = order;
    renderSide();
    $('#side').scrollTop = 0;
    if (window.matchMedia('(max-width: 1040px)').matches) window.scrollTo({ top: $('#work').offsetTop - 12 });
    schedule();
  } catch (err) {
    if (err instanceof SignedOut) return;
    toast(err.message, 'bad');
    closeSide();
  }
}

function closeSide() {
  Object.assign(S, { side: null, openId: null, order: null, formFor: null });
  history.replaceState(null, '', location.pathname + location.search);
  layout();
}

async function openForm(kind) {
  // Admin picks whose order it is from the People list.
  if (S.user.role === 'admin' && !S.people) {
    try {
      S.people = await api('GET', '/api/users');
    } catch (err) {
      if (!(err instanceof SignedOut)) toast(err.message, 'bad');
      return;
    }
  }
  S.side = kind;
  S.formFor = null;
  if (kind === 'new') {
    S.openId = null;
    S.order = null;
    history.replaceState(null, '', location.pathname + location.search);
  }
  layout();
  renderSide();
  $('#side').scrollTop = 0;
  $('#side [name=customerName]')?.focus();
}

function renderSide() {
  const side = $('#side');
  if (S.side === 'order' && S.order) side.innerHTML = orderView(S.order);
  else if (S.side === 'new') side.innerHTML = orderForm(null, 'new');
  else if ((S.side === 'resubmit' || S.side === 'edit') && S.order) side.innerHTML = orderForm(S.order, S.side);
  if (S.side !== 'order') recalc();
}

const dl = (rows) => `<dl class="facts">${rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>`;

function route(o) {
  // A cancelled or deleted order shows how far it got before it stopped.
  let base = o.status;
  for (let i = o.events.length - 1; (base === 'cancelled' || base === 'deleted') && i >= 0; i--) base = o.events[i].from ?? 'pending_approval';
  const reached = REACHED[base] ?? 0;
  const halt = { cancelled: 'Cancelled', rejected: 'Rejected', deleted: 'Deleted' }[o.status];
  const flag = { returned: 'Sent back', on_hold: 'On hold' }[o.status];
  return `<ol class="route" aria-label="Where this order is">${ROUTE.map((s, i) => {
    let cls = '';
    let note = '';
    let title = '';
    if (i < reached) {
      const ev = s.type === 'created' ? o.events[0] : o.events.findLast((e) => e.type === s.type);
      cls = 'done';
      note = ev ? `${ev.actor.name.split(' ')[0]} · ${brief(ev.at)}` : '';
      title = ev ? `${ev.actor.name}, ${stamp(ev.at)}` : '';
    } else if (i === reached) {
      if (halt) {
        cls = 'halt';
        note = halt;
      } else {
        cls = flag ? 'now flag' : 'now';
        note = flag ?? (o.waitingOn ? `With ${o.waitingOn}` : 'Next');
      }
    }
    return `<li class="stn ${cls}"${title ? ` title="${esc(title)}"` : ''}><span class="dot" aria-hidden="true"></span><b>${esc(s.label)}</b>${note ? `<small>${esc(note)}</small>` : ''}</li>`;
  }).join('')}</ol>`;
}

function orderView(o) {
  const facts = [
    ['Customer', o.customerName],
    ['Delivery address', o.address],
    ['Contact number', o.contactNumber],
    ['Division', o.division],
    ['Payment method', o.paymentMethod],
    ['Notes', o.notes],
  ].filter(([, v]) => v);
  const pay = o.payment && [
    ['Paid by', o.payment.method],
    ['Reference number', o.payment.reference],
    ['Amount received', peso(o.payment.amount)],
    ['Paid on', day(o.payment.paidOn)],
    ['Verified by', `${o.payment.verifiedBy}, ${stamp(o.payment.verifiedAt)}`],
  ];
  const short = o.payment && Math.abs(o.payment.amount - o.total) >= 0.01;
  const ship = o.shipment && [
    ['Courier', o.shipment.courier],
    ['Tracking number', o.shipment.trackingNumber],
    ['Dispatched', o.shipment.dispatchedAt && stamp(o.shipment.dispatchedAt)],
    ['Received by', o.shipment.receivedBy],
    ['Delivered', o.shipment.deliveredAt && stamp(o.shipment.deliveredAt)],
  ].filter(([, v]) => v);
  return `
    <div class="side-head">
      <button type="button" class="link" data-close>Back to the list</button>
      <div class="side-top"><h2 class="order-id">${esc(o.id)}</h2>${pill(o.status, o.statusLabel)}</div>
      <p class="sub">Raised by ${esc(o.createdBy.name)}, ${esc(stamp(o.createdAt))}${o.waitingOn ? ` · Next: <strong>${esc(o.waitingOn)}</strong>` : ''}</p>
    </div>
    <div class="route-wrap">${route(o)}</div>
    ${stepBox(o)}
    <section class="block"><h3 class="label">Order</h3>${dl(facts)}</section>
    <section class="block"><h3 class="label">Items</h3>${itemsTable(o)}</section>
    ${pay ? `<section class="block"><h3 class="label">Payment</h3>${dl(pay)}${short ? `<p class="warn">The amount received differs from the order total of ${peso(o.total)}.</p>` : ''}</section>` : ''}
    ${ship?.length ? `<section class="block"><h3 class="label">Shipment</h3>${dl(ship)}</section>` : ''}
    <section class="block" id="audit">${auditView(o)}</section>`;
}

function itemsTable(o) {
  return `<div class="table-wrap"><table class="items">
    <thead><tr><th>Product</th><th class="num">Qty</th><th class="num">Unit price</th><th class="num">Amount</th></tr></thead>
    <tbody>${o.items.map((it) => `<tr><td>${esc(it.product)}</td><td class="num">${it.qty}</td><td class="num">${peso(it.unitPrice)}</td><td class="num">${peso(it.qty * it.unitPrice)}</td></tr>`).join('')}</tbody>
    <tfoot><tr><td colspan="3">Total</td><td class="num">${peso(o.total)}</td></tr></tfoot>
  </table></div>`;
}

function stepBox(o) {
  if (!o.actions.length) {
    const text = DONE.has(o.status)
      ? `This order is ${o.statusLabel.toLowerCase()}. Nothing more to do.`
      : `Nothing for you to do on this order right now.${o.waitingOn ? ` It's with ${o.waitingOn}.` : ''}`;
    return `<p class="quiet-box">${esc(text)}</p>`;
  }
  const open = o.actions.find((a) => a.name === S.formFor);
  const primary = o.actions.find((a) => !a.danger);
  const buttons = o.actions.map((a) => {
    const cls = a.danger ? 'btn danger quiet' : a === primary ? 'btn' : 'btn quiet';
    return `<button type="button" class="${cls}" data-action="${esc(a.name)}"${a.form ? ` data-form="${esc(a.form)}"` : ''}>${esc(a.label)}</button>`;
  }).join('');
  return `<section class="step" aria-label="Your step"><h3 class="label">Your step</h3>${open ? actionForm(o, open) : `<div class="actions">${buttons}</div>`}</section>`;
}

function fieldHtml(f, value, id, placeholder, name = f.name) {
  const v = value ?? '';
  const req = f.required ? ' required' : '';
  const ph = placeholder ? ` placeholder="${esc(placeholder)}"` : '';
  let control;
  if (f.type === 'select') {
    const choose = v === '' ? '<option value="">Choose…</option>' : '';
    control = `<select id="${id}" name="${name}"${req}>${choose}${f.options.map((opt) => `<option${opt === v ? ' selected' : ''}>${esc(opt)}</option>`).join('')}</select>`;
  } else if (f.type === 'textarea') {
    control = `<textarea id="${id}" name="${name}" maxlength="${f.max}" rows="3"${req}${ph}>${esc(v)}</textarea>`;
  } else if (f.type === 'number') {
    control = `<input id="${id}" name="${name}" type="number" step="0.01" min="${f.min}" inputmode="decimal" value="${esc(v)}"${req}${ph}>`;
  } else {
    control = `<input id="${id}" name="${name}" type="${f.type}"${f.max ? ` maxlength="${f.max}"` : ''} value="${esc(v)}"${req}${ph}>`;
  }
  return `<label class="field${f.type === 'textarea' ? ' wide' : ''}" for="${id}"><span>${esc(f.label)}${f.required ? '' : ' <em>optional</em>'}</span>${control}</label>`;
}

function actionForm(o, a) {
  const defaults = { method: o.paymentMethod, amount: o.total, paidOn: today() };
  const fields = a.fields.length ? `<div class="grid2">${a.fields.map((f) => fieldHtml(f, defaults[f.name], `act-${f.name}`)).join('')}</div>` : '';
  return `<form id="action-form" data-action="${esc(a.name)}" novalidate>
    <p class="hint">Moves ${esc(o.id)} to <strong>${esc(a.to)}</strong>. The audit trail records it as you, now.</p>
    ${fields}
    <p class="error" id="action-error" role="alert" hidden></p>
    <div class="actions">
      <button type="submit" class="btn${a.danger ? ' danger' : ''}">${esc(a.label)}</button>
      <button type="button" class="btn quiet" data-back>Back</button>
    </div>
  </form>`;
}

function itemRow(it = { product: '', qty: 1, unitPrice: '' }) {
  return `<div class="item-row">
    <label class="field ip"><span>Product</span><input type="text" name="product" maxlength="120" value="${esc(it.product)}" placeholder="e.g. Paracetamol 500 mg, box of 100"></label>
    <label class="field iq"><span>Qty</span><input type="number" name="qty" min="1" step="1" inputmode="numeric" value="${esc(it.qty)}"></label>
    <label class="field iu"><span>Unit price</span><input type="number" name="unitPrice" min="0" step="0.01" inputmode="decimal" value="${esc(it.unitPrice)}"></label>
    <div class="field ia"><span>Amount</span><output class="line-amt">${peso(0)}</output></div>
    <button type="button" class="remove" data-remove-item aria-label="Remove this item">×</button>
  </div>`;
}

// Admin's pick of whose order it is: an active salesperson, or Admin for a new order.
function ownerField(o) {
  const sales = (S.people?.users ?? []).filter((u) => u.role === 'salesperson' && u.active);
  const options = [];
  if (!o) options.push('<option value="">Myself (Admin)</option>');
  else if (!sales.some((u) => u.id === o.ownerId)) options.push(`<option value="" selected>${esc(o.owner?.name ?? o.createdBy.name)} (keep)</option>`);
  for (const u of sales) options.push(`<option value="${u.id}"${o && u.id === o.ownerId ? ' selected' : ''}>${esc(u.name)}</option>`);
  return `<label class="field" for="o-owner"><span>Salesperson</span><select id="o-owner" name="ownerId">${options.join('')}</select></label>`;
}

function statusField(o) {
  const options = Object.entries(S.meta.statuses)
    .filter(([status]) => status !== 'deleted')
    .map(([status, label]) => `<option value="${status}"${status === o.status ? ' selected' : ''}>${esc(label)}</option>`)
    .join('');
  return `<label class="field" for="e-status"><span>Status</span><select id="e-status" name="status">${options}</select></label>`;
}

// mode: 'new', 'resubmit' (Salesperson fixes an order Management sent back) or 'edit' (Admin
// changes anything, the status included).
function orderForm(o, mode) {
  const fields = S.meta.orderFields;
  const notes = fields.find((f) => f.name === 'notes');
  const items = o?.items?.length ? o.items : [undefined];
  const sentBack = mode === 'resubmit' && o.events.findLast((e) => e.type === 'send_back');
  const back = o ? `<button type="button" class="link" data-reopen>Back to ${esc(o.id)}</button>` : '<button type="button" class="link" data-close>Back to the list</button>';
  const [title, intro, submit] = {
    new: ['New order', 'Management approves it next, then Finance verifies payment and Dispatch ships it.', 'Submit for approval'],
    resubmit: [`Fix and resubmit ${esc(o?.id)}`, 'Make the changes Management asked for, then resubmit. It goes back to Management for approval.', 'Resubmit for approval'],
    edit: [`Edit ${esc(o?.id)}`, "Change anything, the status included. What you change goes into the order's thread in #order-audit as Edited by Admin, with a line in the Admin log.", 'Save changes'],
  }[mode];
  const top = [S.user.role === 'admin' && mode !== 'resubmit' ? ownerField(o) : '', mode === 'edit' ? statusField(o) : ''].join('');
  const group = (legend, prefix, source, keys) => `
      <fieldset class="items-edit">
        <legend class="label">${legend}</legend>
        <div class="grid2">${keys.map((k) => fieldHtml(S.meta.fields[k], source[k], `e-${prefix}-${k}`, '', `${prefix}.${k}`)).join('')}</div>
      </fieldset>`;
  const shipKeys = mode === 'edit' && o.shipment ? ['courier', 'trackingNumber', 'receivedBy'].filter((k) => o.shipment[k] != null) : [];
  return `
    <div class="side-head">
      ${back}
      <h2 class="title">${title}</h2>
      <p class="sub">${esc(intro)}</p>
    </div>
    ${sentBack?.note ? `<p class="warn"><strong>${esc(sentBack.actor.name)} sent it back:</strong> ${esc(sentBack.note)}</p>` : ''}
    <form id="order-form" class="block" data-mode="${mode}" novalidate>
      ${top ? `<div class="grid2">${top}</div>` : ''}
      <div class="grid2">${fields.filter((f) => f !== notes).map((f) => fieldHtml(f, o?.[f.name], `o-${f.name}`, PLACEHOLDERS[f.name])).join('')}</div>
      <fieldset class="items-edit">
        <legend class="label">Items</legend>
        <div class="item-rows" id="item-rows">${items.map((it) => itemRow(it)).join('')}</div>
        <div class="items-foot">
          <button type="button" class="btn quiet small" data-add-item>Add item</button>
          <p>Total <strong id="form-total">${peso(0)}</strong></p>
        </div>
      </fieldset>
      ${notes ? `<div class="grid2">${fieldHtml(notes, o?.notes, 'o-notes', PLACEHOLDERS.notes)}</div>` : ''}
      ${mode === 'edit' && o.payment ? group('Payment', 'payment', o.payment, ['method', 'reference', 'amount', 'paidOn']) : ''}
      ${shipKeys.length ? group('Shipment', 'shipment', o.shipment, shipKeys) : ''}
      ${mode === 'edit' ? `<div class="grid2">${fieldHtml(S.meta.fields.reason, '', 'e-reason', 'Why this change is needed. It goes in the audit trail.')}</div>` : ''}
      <p class="error" id="order-error" role="alert" hidden></p>
      <div class="actions">
        <button type="submit" class="btn">${submit}</button>
        <button type="button" class="btn quiet" ${o ? 'data-reopen' : 'data-close'}>${o ? 'Back' : 'Discard'}</button>
      </div>
    </form>`;
}

function recalc() {
  const rows = document.querySelectorAll('#item-rows .item-row');
  let total = 0;
  for (const row of rows) {
    const amount = (Number(row.querySelector('[name=qty]').value) || 0) * (Number(row.querySelector('[name=unitPrice]').value) || 0);
    total += amount;
    row.querySelector('.line-amt').textContent = peso(amount);
    row.querySelector('[data-remove-item]').disabled = rows.length === 1;
  }
  const t = $('#form-total');
  if (t) t.textContent = peso(total);
}

// What reached #order-audit, step by step.
const DISCORD_STATE = {
  sent: (d) => ['sent', `Stored in ${d.inThread ? "the order's thread" : '#order-audit'}, data ${d.asReply ? 'in a reply' : 'in the next message'}`],
  queued: () => ['wait', 'Waiting to be stored in Discord'],
  sending: () => ['wait', 'Storing in Discord'],
  failed: (d) => ['bad', `Not stored in Discord yet: ${d.error}`],
  mocked: () => ['off', 'Mock mode: in memory only'],
  off: () => ['off', 'In memory only'],
};

function detailsText(details) {
  return Object.entries(details).map(([k, v]) => {
    if (k === 'changed') return `Changed: ${v.join(', ')}`;
    if (k === 'before') return `Before: ${Object.entries(v).map(([field, old]) => `${field}: ${old}`).join(' · ')}`;
    const value = k === 'amount' || k === 'total' ? peso(v) : k === 'paidOn' ? day(v) : v;
    return `${S.meta.fieldLabels[k] ?? k}: ${value}`;
  }).join(' · ');
}

function auditView(o) {
  const d = S.meta.discord;
  const store = S.meta.storage;
  const where = store.kind === 'discord'
    ? "Each step is posted to this order's thread in #order-audit, followed by a reply holding the order's data as JSON. Those replies are where the order is stored: the server reads them back when it starts."
    : store.kind === 'discord-write-only'
      ? "Each step and its data are posted in #order-audit, but without the bot's token they can't be read back, so orders are lost when the server stops."
      : d.mode === 'mock' ? 'Mock mode: orders are kept in memory only and are lost when the server stops.'
      : 'Sending to Discord is off: orders are kept in memory only and are lost when the server stops.';
  const privacy = store.kind === 'memory' ? ''
    : store.encrypts ? ' Customer details, notes and reasons in the data are encrypted.'
    : ' RECORD_SECRET is not set, so customer details in the data are readable by everyone in the channel.';
  const failed = o.events.some((e) => e.discord?.state === 'failed');
  const canRetry = failed && ['management', 'admin'].includes(S.user.role);
  const steps = o.events.map((e) => {
    const [tone, text] = (DISCORD_STATE[e.discord?.state] ?? DISCORD_STATE.off)(e.discord ?? {});
    const change = e.from && e.from !== e.to ? `${S.meta.statuses[e.from]} → ${S.meta.statuses[e.to]}` : S.meta.statuses[e.to];
    return `<li>
      <span class="tick${tone === 'bad' ? ' bad' : ''}" aria-hidden="true"></span>
      <div>
        <p class="what">${esc(e.label)} <span class="change">${esc(change)}</span></p>
        <p class="by">${esc(e.actor.name)} · ${esc(S.meta.roles[e.actor.role] ?? e.actor.role)} · <time datetime="${esc(e.at)}">${esc(stamp(e.at))}</time></p>
        ${e.note ? `<p class="note">${esc(e.note)}</p>` : ''}
        ${e.details ? `<p class="details">${esc(detailsText(e.details))}</p>` : ''}
        <span class="dc ${tone}">${esc(text)}</span>
      </div>
    </li>`;
  }).join('');
  return `
    <div class="audit-head">
      <h3 class="label">Audit trail</h3>
      ${canRetry ? '<button type="button" class="btn quiet small" data-retry>Send again</button>' : ''}
    </div>
    <p class="hint">${esc(where + privacy)}</p>
    ${o.discord?.threadError && d.threads ? `<p class="warn">No thread yet: ${esc(o.discord.threadError)}. Steps go into the channel until it works.</p>` : ''}
    <ol class="trail">${steps}</ol>`;
}

async function submitAction(form) {
  const name = form.dataset.action;
  const body = Object.fromEntries(new FormData(form));
  const { order } = await api('POST', `/api/orders/${encodeURIComponent(S.order.id)}/actions/${name}`, body);
  S.order = order;
  S.formFor = null;
  toast(`${order.id}: ${order.events.at(-1).label}.`);
  renderSide();
  await loadOrders();
  schedule();
}

async function submitOrder(form) {
  const mode = form.dataset.mode;
  const data = new FormData(form);
  const body = Object.fromEntries(S.meta.orderFields.map((f) => [f.name, data.get(f.name) ?? '']));
  body.items = [...form.querySelectorAll('.item-row')]
    .map((row) => ({
      product: row.querySelector('[name=product]').value,
      qty: row.querySelector('[name=qty]').value,
      unitPrice: row.querySelector('[name=unitPrice]').value,
    }))
    .filter((it) => it.product.trim() || it.unitPrice !== '');
  if (data.has('ownerId')) body.ownerId = data.get('ownerId');
  if (mode === 'edit') {
    body.status = data.get('status');
    body.reason = data.get('reason');
    for (const prefix of ['payment', 'shipment']) {
      const part = {};
      for (const [k, v] of data) if (k.startsWith(`${prefix}.`)) part[k.slice(prefix.length + 1)] = v;
      if (Object.keys(part).length) body[prefix] = part;
    }
  }
  const id = encodeURIComponent(S.order?.id ?? '');
  const { order } = mode === 'edit' ? await api('PATCH', `/api/orders/${id}`, body)
    : mode === 'resubmit' ? await api('POST', `/api/orders/${id}/actions/resubmit`, body)
    : await api('POST', '/api/orders', body);
  toast({
    new: `${order.id} submitted for approval.`,
    resubmit: `${order.id} resubmitted for approval.`,
    edit: `${order.id} saved. The change is logged in #order-audit.`,
  }[mode]);
  Object.assign(S, { side: 'order', openId: order.id, order, formFor: null });
  history.replaceState(null, '', `#${order.id}`);
  const { orders } = await api('GET', '/api/orders');
  S.orders = orders;
  const summary = orders.find((x) => x.id === order.id);
  const home = TABS[S.user.role].find((t) => t.match && summary && t.match(summary));
  if (home) S.tab = home.key;
  layout();
  renderSide();
  $('#side').scrollTop = 0;
  schedule();
}

$('#side').addEventListener('submit', async (e) => {
  e.preventDefault();
  const form = e.target;
  const btn = form.querySelector('[type=submit]');
  const err = form.querySelector('.error');
  btn.disabled = true;
  err.hidden = true;
  try {
    if (form.id === 'action-form') await submitAction(form);
    else if (form.id === 'order-form') await submitOrder(form);
  } catch (error) {
    if (error instanceof SignedOut) return;
    err.textContent = error.message;
    err.hidden = false;
    btn.disabled = false;
  }
});

$('#side').addEventListener('click', async (e) => {
  const t = e.target.closest('button');
  if (!t) return;
  if (t.matches('[data-close]')) return closeSide();
  if (t.matches('[data-reopen]')) {
    S.side = 'order';
    return renderSide();
  }
  if (t.matches('[data-action]')) {
    if (t.dataset.form === 'order') return openForm('resubmit');
    if (t.dataset.form === 'edit') return openForm('edit');
    S.formFor = t.dataset.action;
    renderSide();
    ($('#action-form input, #action-form select, #action-form textarea') ?? $('#action-form [type=submit]'))?.focus();
    return;
  }
  if (t.matches('[data-back]')) {
    S.formFor = null;
    return renderSide();
  }
  if (t.matches('[data-add-item]')) {
    $('#item-rows').insertAdjacentHTML('beforeend', itemRow());
    recalc();
    $('#item-rows .item-row:last-child input')?.focus();
    return;
  }
  if (t.matches('[data-remove-item]')) {
    t.closest('.item-row').remove();
    return recalc();
  }
  if (t.matches('[data-retry]')) {
    t.disabled = true;
    try {
      const { order } = await api('POST', `/api/orders/${encodeURIComponent(S.order.id)}/audit/retry`, {});
      S.order = order;
      $('#audit').innerHTML = auditView(order);
      toast('Sending the missing steps to #order-audit again.');
      schedule();
    } catch (err) {
      if (!(err instanceof SignedOut)) toast(err.message, 'bad');
      t.disabled = false;
    }
  }
});

$('#side').addEventListener('input', (e) => {
  if (e.target.closest('#item-rows')) recalc();
});

$('#main').addEventListener('click', (e) => {
  const open = e.target.closest('[data-open]');
  if (open) openOrder(open.dataset.open);
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && S.side && !e.target.closest('input, textarea, select')) closeSide();
});

// ---------- people (Admin) ----------

async function renderPeople() {
  try {
    S.people = await api('GET', '/api/users');
  } catch (err) {
    if (err instanceof SignedOut) return;
    $('#main').innerHTML = `<div class="panel" id="people-panel"><p class="error">${esc(err.message)}</p></div>`;
    return;
  }
  if (currentTab().key === 'people') $('#main').innerHTML = peopleView();
}

function peopleView() {
  const { users, roles } = S.people;
  const roleOptions = (selected) => roles.map((r) => `<option value="${r.value}"${r.value === selected ? ' selected' : ''}>${esc(r.label)}</option>`).join('');
  const rows = users.map((u) => {
    const self = u.id === S.user.id;
    return `<tr data-user="${u.id}" data-name="${esc(u.name)}" class="${u.active ? '' : 'inactive'}">
      <td>${esc(u.name)}${self ? ' <small>(you)</small>' : ''}</td>
      <td class="mono">${esc(u.email)}</td>
      <td><select data-role aria-label="Role for ${esc(u.name)}"${self ? ' disabled' : ''}>${roleOptions(u.role)}</select></td>
      <td><div class="status-cell">${u.active ? '<span class="pill ok">Active</span>' : '<span class="pill stop">Deactivated</span>'}${self ? '' : `<button type="button" class="link" data-toggle="${u.active ? 'off' : 'on'}">${u.active ? 'Deactivate' : 'Reactivate'}</button>`}</div></td>
      <td><button type="button" class="btn quiet small" data-reset>Reset password</button></td>
    </tr>`;
  }).join('');
  return `<div class="panel" id="people-panel">
    <div class="side-head">
      <h2 class="title">People</h2>
      <p class="sub">Accounts are kept in data/users.json on this computer, with hashed passwords. Every change here is posted to the Admin log thread in #order-audit: who changed which account, and how. Never passwords.</p>
    </div>
    ${S.reveal ? `<div class="callout" role="status">
      <span>Password for <strong>${esc(S.reveal.email)}</strong>, shown only this once:</span>
      <code>${esc(S.reveal.password)}</code>
      <button type="button" class="btn quiet small" data-copy>Copy</button>
      <button type="button" class="link" data-dismiss>Done</button>
    </div>` : ''}
    <div class="table-wrap"><table class="people">
      <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th><span class="sr">Password</span></th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    <form id="person-form" class="person-form" novalidate>
      <h3 class="label">Add a person</h3>
      <div class="grid4">
        <label class="field" for="p-name"><span>Name</span><input id="p-name" name="name" type="text" maxlength="80" required></label>
        <label class="field" for="p-email"><span>Email</span><input id="p-email" name="email" type="email" autocomplete="off" required></label>
        <label class="field" for="p-role"><span>Role</span><select id="p-role" name="role">${roleOptions('salesperson')}</select></label>
        <label class="field" for="p-password"><span>Password <em>optional</em></span><input id="p-password" name="password" type="password" autocomplete="new-password" placeholder="Blank makes one for you"></label>
      </div>
      <p class="error" id="person-error" role="alert" hidden></p>
      <div class="actions"><button type="submit" class="btn">Add person</button></div>
    </form>
  </div>`;
}

async function updatePerson(row, patch) {
  const name = row.dataset.name;
  try {
    const { user, password } = await api('PATCH', `/api/users/${row.dataset.user}`, patch);
    if (password) S.reveal = { email: user.email, password };
    toast(patch.resetPassword ? `New password made for ${name}. They're signed out everywhere.`
      : patch.active === false ? `${name} is deactivated and signed out.`
      : patch.active === true ? `${name} can sign in again.`
      : `${name} is now ${user.roleLabel}.`);
  } catch (err) {
    if (err instanceof SignedOut) return;
    toast(err.message, 'bad');
  }
  await renderPeople();
}

$('#main').addEventListener('change', (e) => {
  if (e.target.matches('[data-role]')) updatePerson(e.target.closest('[data-user]'), { role: e.target.value });
});

$('#main').addEventListener('click', (e) => {
  const t = e.target.closest('button');
  if (!t) return;
  const row = t.closest('[data-user]');
  if (t.matches('[data-toggle]')) updatePerson(row, { active: t.dataset.toggle === 'on' });
  else if (t.matches('[data-reset]')) {
    if (confirm(`Make a new password for ${row.dataset.name}? Their current password stops working and they're signed out.`)) updatePerson(row, { resetPassword: true });
  } else if (t.matches('[data-copy]')) {
    navigator.clipboard?.writeText(S.reveal.password).then(() => toast('Password copied.'), () => toast('Copying failed. Select the password and copy it.', 'bad'));
  } else if (t.matches('[data-dismiss]')) {
    S.reveal = null;
    $('#main').innerHTML = peopleView();
  }
});

$('#main').addEventListener('submit', async (e) => {
  if (e.target.id !== 'person-form') return;
  e.preventDefault();
  const form = e.target;
  const btn = form.querySelector('[type=submit]');
  const err = $('#person-error');
  btn.disabled = true;
  err.hidden = true;
  try {
    const { user, password } = await api('POST', '/api/users', Object.fromEntries(new FormData(form)));
    S.reveal = password ? { email: user.email, password } : null;
    toast(`${user.name} can now sign in as ${user.roleLabel}.`);
    await renderPeople();
  } catch (error) {
    if (error instanceof SignedOut) return;
    err.textContent = error.message;
    err.hidden = false;
    btn.disabled = false;
  }
});

// ---------- keeping up with other people's steps ----------

function schedule() {
  clearTimeout(S.timer);
  if (!S.user) return;
  const sending = S.order?.events.some((e) => e.discord?.state === 'queued' || e.discord?.state === 'sending');
  S.timer = setTimeout(tick, sending ? 2000 : 15000);
}

async function tick() {
  if (!S.user) return;
  if (!document.hidden) {
    try {
      await loadOrders();
      if (S.side === 'order' && S.openId) {
        const { order } = await api('GET', `/api/orders/${encodeURIComponent(S.openId)}`);
        if (S.side === 'order' && S.openId === order.id) {
          const moved = order.updatedAt !== S.order?.updatedAt;
          S.order = order;
          if (moved && !S.formFor) renderSide();
          else if ($('#audit')) $('#audit').innerHTML = auditView(order);
        }
      }
    } catch (err) {
      if (err instanceof SignedOut) return;
    }
  }
  schedule();
}

document.addEventListener('visibilitychange', () => {
  if (!document.hidden && S.user) tick();
});

// ---------- start ----------

$('#legend').innerHTML = ROUTE.map((s) => `<li class="stn"><span class="dot" aria-hidden="true"></span><b>${esc(s.label)}</b><small>${esc(s.who)}</small></li>`).join('');

api('GET', '/api/auth/me')
  .then(({ user }) => enter(user))
  .catch((err) => { if (!(err instanceof SignedOut)) signedOut(err.message); });
</script>
</body>
</html>
