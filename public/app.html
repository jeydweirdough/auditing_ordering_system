// Photos from phones are often 3 to 5 MB. One over 1 MB is redrawn at most 1600 px on its long
// side as a JPEG, which keeps a receipt or a prescription readable at a fraction of the size.
async function shrink(file) {
  if (!/^image\/(jpeg|png|webp)$/.test(file.type) || file.size <= 1_000_000) return file;
  try {
    const bitmap = await createImageBitmap(file);
    const scale = Math.min(1, 1600 / Math.max(bitmap.width, bitmap.height));
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(bitmap.width * scale);
    canvas.height = Math.round(bitmap.height * scale);
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff';   // a transparent PNG would otherwise turn black
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
    const blob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/jpeg', 0.82));
    if (!blob || blob.size >= file.size) return file;
    return new File([blob], `${file.name.replace(/\.[^.]+$/, '')}.jpg`, { type: 'image/jpeg' });
  } catch {
    return file;
  }
}

async function addFiles(list) {
  const { max, maxBytes } = S.meta.files;
  const accept = S.meta.files.accept.split(',');
  for (const picked of list) {
    if (!accept.includes(`.${picked.name.split('.').pop().toLowerCase()}`)) {
      toast(`${picked.name} isn't a photo, PDF, Word or Excel file.`, 'bad');
      continue;
    }
    if (S.staged.length >= max) {
      toast(`An order can have at most ${max} files.`, 'bad');
      break;
    }
    const file = await shrink(picked);
    const used = S.staged.reduce((n, f) => n + f.size, 0);
    if (used + file.size > maxBytes) {
      toast(`${picked.name} doesn't fit: files can add up to ${maxBytes / 1e6} MB per order.`, 'bad');
      continue;
    }
    S.staged.push({ name: file.name, size: file.size, kind: 'payment_proof', file });
  }
}

const base64 = (file) => new Promise((resolve, reject) => {
  const reader = new FileReader();
  reader.onload = () => resolve(String(reader.result).split(',')[1] ?? '');
  reader.onerror = () => reject(new Error(`${file.name} couldn't be read. Attach it again.`));
  reader.readAsDataURL(file);
});

function filesList(o) {
  const kinds = S.meta.files.kinds;
  return `<ul class="file-rows">${o.attachments.map((f) => `<li class="file-row">

// What reached #order-audit, step by step.
const DISCORD_STATE = {
  sent: (d) => ['sent', `Stored in ${d.inThread ? "the order's thread" : '#order-audit'}, data ${d.asReply ? 'in a reply' : 'in the next message'}`],
  queued: () => ['wait', 'Waiting to be stored in Discord'],
  sending: () => ['wait', 'Storing in Discord'],
  failed: (d) => ['bad', `Not stored in Discord yet: ${d.error}`],
  mocked: () => ['off', 'Mock mode: in memory only'],
  off: () => ['off', 'In memory only'],
};

function detailsText(details) {
  return Object.entries(details).map(([k, v]) => {
    if (k === 'changed') return `Changed: ${v.join(', ')}`;
    if (k === 'before') return `Before: ${Object.entries(v).map(([field, old]) => `${field}: ${old}`).join(' · ')}`;
    const value = k === 'amount' || k === 'total' ? peso(v) : k === 'paidOn' ? day(v) : v;
    return `${S.meta.fieldLabels[k] ?? k}: ${value}`;
  }).join(' · ');
}

function auditView(o) {
  const d = S.meta.discord;
  const store = S.meta.storage;
  const where = store.kind === 'discord'
    ? "Each step is posted to this order's thread in #order-audit, followed by a reply holding the order's data as JSON. Those replies are where the order is stored: the server reads them back when it starts."
    : store.kind === 'discord-write-only'
      ? "Each step and its data are posted in #order-audit, but without the bot's token they can't be read back, so orders are lost when the server stops."
      : d.mode === 'mock' ? 'Mock mode: orders are kept in memory only and are lost when the server stops.'
      : 'Sending to Discord is off: orders are kept in memory only and are lost when the server stops.';
  const privacy = store.kind === 'memory' ? ''
    : store.encrypts ? ' Customer details, notes and reasons in the data are encrypted.'
    : ' RECORD_SECRET is not set, so customer details in the data are readable by everyone in the channel.';
  const failed = o.events.some((e) => e.discord?.state === 'failed');
  const canRetry = failed && ['management', 'admin'].includes(S.user.role);
  const steps = o.events.map((e) => {
    const [tone, text] = (DISCORD_STATE[e.discord?.state] ?? DISCORD_STATE.off)(e.discord ?? {});
    const change = e.from && e.from !== e.to ? `${S.meta.statuses[e.from]} → ${S.meta.statuses[e.to]}` : S.meta.statuses[e.to];
    return `<li>
      <span class="tick${tone === 'bad' ? ' bad' : ''}" aria-hidden="true"></span>
      <div>
        <p class="what">${esc(e.label)} <span class="change">${esc(change)}</span></p>
        <p class="by">${esc(e.actor.name)} · ${esc(S.meta.roles[e.actor.role] ?? e.actor.role)} · <time datetime="${esc(e.at)}">${esc(stamp(e.at))}</time></p>
        ${e.note ? `<p class="note">${esc(e.note)}</p>` : ''}
        ${e.details ? `<p class="details">${esc(detailsText(e.details))}</p>` : ''}
        <span class="dc ${tone}">${esc(text)}</span>
      </div>
    </li>`;
  }).join('');
  return `
    <div class="audit-head">
      <h3 class="label">Audit trail</h3>
      ${canRetry ? '<button type="button" class="btn quiet small" data-retry>Send again</button>' : ''}
    </div>
    <p class="hint">${esc(where + privacy)}</p>
    ${o.discord?.threadError && d.threads ? `<p class="warn">No thread yet: ${esc(o.discord.threadError)}. Steps go into the channel until it works.</p>` : ''}
    <ol class="trail">${steps}</ol>`;
}

async function submitOrder(form) {
  const mode = form.dataset.mode;
  const data = new FormData(form);
  const body = Object.fromEntries(S.meta.orderFields.map((f) => [f.name, data.get(f.name) ?? '']));
  body.items = [...form.querySelectorAll('.item-row')]
    .map((row) => ({
      product: row.querySelector('[name=product]').value,
      qty: row.querySelector('[name=qty]').value,
      unitPrice: row.querySelector('[name=unitPrice]').value,
      priceType: row.querySelector('[name=priceType]')?.value || undefined,
      unitType: row.querySelector('[name=unitType]')?.value || undefined,
    }))
    .filter((it) => it.product.trim() || it.unitPrice !== '');

  const division = body.division;
  const paymentTerms = String(body.paymentTerms || '').toUpperCase();
  const source = String(body.source || '').toUpperCase();
  const notes = String(body.notes || '').trim();
  const remarks = String(body.remarks || '').trim();
  const hasPrescription = S.staged.some((f) => f.kind === 'prescription') || S.order?.attachments?.some((f) => f.kind === 'prescription');
  const hasGuaranteeLetter = S.staged.some((f) => f.kind === 'guarantee_letter') || S.order?.attachments?.some((f) => f.kind === 'guarantee_letter');

  if (division !== 'B2B' && (paymentTerms.includes('DSWD') || paymentTerms.includes('PCSO') || source.includes('DSWD') || source.includes('PCSO'))) {
    if (!hasGuaranteeLetter) {
      throw new Error(`Orders with terms or source "${body.paymentTerms || body.source}" require an attached file tagged as 'Guarantee letter (DSWD/PCSO)'.`);
    }
  }

  if (division === 'BID' && !notes && !remarks) {
    throw new Error('Division BID has no standard price list; notes or customer remarks explaining the bidding pricing are required.');
  }

  for (let i = 0; i < body.items.length; i++) {
    const it = body.items[i];
    if ((it.priceType === 'special' || it.priceType === 'government') && !notes) {
      throw new Error(`Item ${i + 1}: ${it.priceType === 'special' ? 'Special Price' : 'Government Price'} requires an explanation in the Notes field.`);
    }
    if (division === 'B2C' && it.priceType === 'doctor' && !hasPrescription) {
      throw new Error(`Item ${i + 1}: Doctor's Price for B2C requires a Prescription / Rx attachment.`);
    }
  }
  if (data.has('ownerId')) body.ownerId = data.get('ownerId');
  if (mode === 'new' && S.orderFor) body.ownerId = S.orderFor.id;
  if (mode === 'new' && S.staged.length) {
    body.attachments = await Promise.all(S.staged.map(async (f) => ({ name: f.name, kind: f.kind, data: await base64(f.file) })));
  }
  if (mode === 'edit') {
    body.status = data.get('status');
    body.reason = data.get('reason');
    for (const prefix of ['payment', 'shipment']) {
      const part = {};
      for (const [k, v] of data) if (k.startsWith(`${prefix}.`)) part[k.slice(prefix.length + 1)] = v;
      if (Object.keys(part).length) body[prefix] = part;
    }
  }
  const id = encodeURIComponent(S.order?.id ?? '');
  const { order } = mode === 'edit' ? await api('PATCH', `/api/orders/${id}`, body)
    : mode === 'resubmit' ? await api('POST', `/api/orders/${id}/actions/resubmit`, body)
    : await api('POST', '/api/orders', body);
  toast({
    new: `${order.id} submitted for approval.`,
    resubmit: `${order.id} resubmitted for approval.`,
    edit: `${order.id} saved. The change is logged in #order-audit.`,
  }[mode]);
  Object.assign(S, { page: null, side: 'order', openId: order.id, order, formFor: null, staged: [], orderFor: null });
  history.replaceState(null, '', `#${order.id}`);
  const { orders } = await api('GET', '/api/orders');
  S.orders = orders;
  const summary = orders.find((x) => x.id === order.id);
  const home = TABS[S.user.role].find((t) => t.match && summary && t.match(summary));
  if (home) S.tab = home.key;
  layout();
  renderSide();
  $('#side').scrollTop = 0;
  schedule();
}

$('#work').addEventListener('submit', async (e) => {
  if (e.target.id !== 'action-form' && e.target.id !== 'order-form') return;
  e.preventDefault();
  const form = e.target;
  const btn = form.querySelector('[type=submit]');
  const err = form.querySelector('.error');
  btn.disabled = true;
  err.hidden = true;
  try {
    if (form.id === 'action-form') await submitAction(form);
    else if (form.id === 'order-form') await submitOrder(form);
  } catch (error) {
    if (error instanceof SignedOut) return;
    err.textContent = error.message;
    err.hidden = false;
    btn.disabled = false;
  }
});

$('#work').addEventListener('click', async (e) => {
  const t = e.target.closest('button');
  if (!t) return;
  if (t.matches('[data-close-new-order]')) {
    return closeNewOrderPage();
  }
  if (t.matches('[data-close]')) {
    S.staged = [];
    S.orderFor = null;
    return closeSide();
  }
  if (t.matches('[data-change-for]')) return askWhoFor();
  if (t.matches('[data-reopen]')) {
    S.side = 'order';
    return renderSide();
  }
  if (t.matches('[data-action]')) {
    if (t.dataset.form === 'order') return openForm('resubmit');
    if (t.dataset.form === 'edit') return openForm('edit');
    S.formFor = t.dataset.action;
    renderSide();
    ($('#action-form input, #action-form select, #action-form textarea') ?? $('#action-form [type=submit]'))?.focus();
    return;
  }
  if (t.matches('[data-back]')) {
    S.formFor = null;
    return renderSide();
  }
  if (t.matches('[data-add-item]')) {
    const div = document.querySelector('#order-form [name=division]')?.value;
    $('#item-rows').insertAdjacentHTML('beforeend', itemRow(undefined, div));
    recalc();
    $('#item-rows .item-row:last-child input')?.focus();
    return;
  }
  if (t.matches('[data-remove-item]')) {
    t.closest('.item-row').remove();
    return recalc();
  }
  if (t.matches('[data-pick-files]')) return $('#file-input').click();
  if (t.matches('[data-remove-file]')) {
    S.staged.splice(Number(t.dataset.removeFile), 1);
    const form = $('#order-form');
    if (form) refreshFormDivision(form);
    return refreshFiles();
  }
  if (t.matches('[data-retry]')) {
    t.disabled = true;
    try {
      const { order } = await api('POST', `/api/orders/${encodeURIComponent(S.order.id)}/audit/retry`, {});
      S.order = order;
      $('#audit').innerHTML = auditView(order);
      toast('Sending the missing steps to #order-audit again.');
      schedule();
    } catch (err) {
      if (!(err instanceof SignedOut)) toast(err.message, 'bad');
      t.disabled = false;
    }
  }
});

$('#work').addEventListener('input', (e) => {
  const row = e.target.closest('#item-rows .item-row');
  if (row) {
    if (e.target.name === 'product') {
      updateItemRowPrice(row);
    }
    recalc();
  }
});

$('#work').addEventListener('change', async (e) => {
  if (e.target.id === 'file-input') {
    await addFiles([...e.target.files]);
    refreshFiles();   // a fresh input, so a removed file can be picked again
  } else if (e.target.matches('[data-file-kind]')) {
    S.staged[Number(e.target.dataset.fileKind)].kind = e.target.value;
    const form = $('#order-form');
    if (form) refreshFormDivision(form);
  } else if (e.target.name === 'division') {
    refreshFormDivision(e.target.form);
  } else if (e.target.name === 'paymentTerms' || e.target.name === 'source') {
    refreshFiles();
  } else if (e.target.matches('[name=priceType], [name=unitType]')) {
    const row = e.target.closest('.item-row');
    if (row) {
      updateItemRowPrice(row);
      recalc();
    }
  } else if (e.target.form) {
    // Suggestions that follow this field, like Sub-division's follow Division.
    for (const input of e.target.form.querySelectorAll(`[data-suggest-by="${e.target.name}"]`)) {
      const lists = S.meta.fields[input.name].suggestionsBy.lists;
      document.getElementById(input.getAttribute('list')).innerHTML = (lists[e.target.value] ?? []).map((s) => `<option value="${esc(s)}">`).join('');
    }
  }
});

$('#main').addEventListener('click', (e) => {
  if (S.page === 'new') return;
  const open = e.target.closest('[data-open]');
  if (open) openOrder(open.dataset.open);
});

document.addEventListener('keydown', (e) => {
  // Escape in the pop-up closes only the pop-up.
  if (e.key === 'Escape' && S.side && !$('#for-dialog').open && !e.target.closest('input, textarea, select')) closeSide();
  if (e.key === 'Escape' && S.page === 'new' && !$('#for-dialog').open && !e.target.closest('input, textarea, select')) closeNewOrderPage();
});

// ---------- people (Admin) ----------

async function renderPeople() {
  try {
    S.people = await api('GET', '/api/users');
  } catch (err) {
    if (err instanceof SignedOut) return;
    $('#main').innerHTML = `<div class="panel" id="people-panel"><p class="error">${esc(err.message)}</p></div>`;
    return;
  }
  if (currentTab().key === 'people') $('#main').innerHTML = peopleView();
}

function peopleView() {
  const { users, roles } = S.people;
  const roleOptions = (selected) => roles.map((r) => `<option value="${r.value}"${r.value === selected ? ' selected' : ''}>${esc(r.label)}</option>`).join('');
  const rows = users.map((u) => {
    const self = u.id === S.user.id;
    return `<tr data-user="${u.id}" data-name="${esc(u.name)}" class="${u.active ? '' : 'inactive'}">
      <td>${esc(u.name)}${self ? ' <small>(you)</small>' : ''}</td>
      <td class="mono">${esc(u.email)}</td>
      <td><select data-role aria-label="Role for ${esc(u.name)}"${self ? ' disabled' : ''}>${roleOptions(u.role)}</select></td>
      <td><div class="status-cell">${u.active ? '<span class="pill ok">Active</span>' : '<span class="pill stop">Deactivated</span>'}${self ? '' : `<button type="button" class="link" data-toggle="${u.active ? 'off' : 'on'}">${u.active ? 'Deactivate' : 'Reactivate'}</button>`}</div></td>
      <td><button type="button" class="btn quiet small" data-reset>Reset password</button></td>
    </tr>`;
  }).join('');
  return `<div class="panel" id="people-panel">
    <div class="side-head">
      <h2 class="title">People</h2>
      <p class="sub">Accounts are kept in data/users.json on this computer, with hashed passwords. Every change here is posted to the Admin log thread in #order-audit: who changed which account, and how. Never passwords.</p>
    </div>
    ${S.reveal ? `<div class="callout" role="status">
      <span>Password for <strong>${esc(S.reveal.email)}</strong>, shown only this once:</span>
      <code>${esc(S.reveal.password)}</code>
      <button type="button" class="btn quiet small" data-copy>Copy</button>
      <button type="button" class="link" data-dismiss>Done</button>
    </div>` : ''}
    <div class="table-wrap"><table class="people">
      <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th><span class="sr">Password</span></th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    <form id="person-form" class="person-form" novalidate>
      <h3 class="label">Add a person</h3>
      <div class="grid4">
        <label class="field" for="p-name"><span>Name</span><input id="p-name" name="name" type="text" maxlength="80" required></label>
        <label class="field" for="p-email"><span>Email</span><input id="p-email" name="email" type="email" autocomplete="off" required></label>
        <label class="field" for="p-role"><span>Role</span><select id="p-role" name="role">${roleOptions('salesperson')}</select></label>
        <label class="field" for="p-password"><span>Password <em>optional</em></span><input id="p-password" name="password" type="password" autocomplete="new-password" placeholder="Blank makes one for you"></label>
      </div>
      <p class="error" id="person-error" role="alert" hidden></p>
      <div class="actions"><button type="submit" class="btn">Add person</button></div>
    </form>
  </div>`;
}

async function updatePerson(row, patch) {
  const name = row.dataset.name;
  try {
    const { user, password } = await api('PATCH', `/api/users/${row.dataset.user}`, patch);
    if (password) S.reveal = { email: user.email, password };
    toast(patch.resetPassword ? `New password made for ${name}. They're signed out everywhere.`
      : patch.active === false ? `${name} is deactivated and signed out.`
      : patch.active === true ? `${name} can sign in again.`
      : `${name} is now ${user.roleLabel}.`);
  } catch (err) {
    if (err instanceof SignedOut) return;
    toast(err.message, 'bad');
  }
  await renderPeople();
}

$('#main').addEventListener('change', (e) => {
  if (e.target.matches('[data-role]')) updatePerson(e.target.closest('[data-user]'), { role: e.target.value });
});

$('#main').addEventListener('click', (e) => {
  const t = e.target.closest('button');
  if (!t) return;
  const row = t.closest('[data-user]');
  if (t.matches('[data-toggle]')) updatePerson(row, { active: t.dataset.toggle === 'on' });
  else if (t.matches('[data-reset]')) {
    if (confirm(`Make a new password for ${row.dataset.name}? Their current password stops working and they're signed out.`)) updatePerson(row, { resetPassword: true });
  } else if (t.matches('[data-copy]')) {
    navigator.clipboard?.writeText(S.reveal.password).then(() => toast('Password copied.'), () => toast('Copying failed. Select the password and copy it.', 'bad'));
  } else if (t.matches('[data-dismiss]')) {
    S.reveal = null;
    $('#main').innerHTML = peopleView();
  }
});

$('#main').addEventListener('submit', async (e) => {
  if (e.target.id !== 'person-form') return;
  e.preventDefault();
  const form = e.target;
  const btn = form.querySelector('[type=submit]');
  const err = $('#person-error');
  btn.disabled = true;
  err.hidden = true;
  try {
    const { user, password } = await api('POST', '/api/users', Object.fromEntries(new FormData(form)));
    S.reveal = password ? { email: user.email, password } : null;
    toast(`${user.name} can now sign in as ${user.roleLabel}.`);
    await renderPeople();
  } catch (error) {
    if (error instanceof SignedOut) return;
    err.textContent = error.message;
    err.hidden = false;
    btn.disabled = false;
  }
});

// ---------- keeping up with other people's steps ----------

function schedule() {
  clearTimeout(S.timer);
  if (!S.user) return;
  const sending = S.order?.events.some((e) => e.discord?.state === 'queued' || e.discord?.state === 'sending');
  S.timer = setTimeout(tick, sending ? 2000 : 15000);
}

async function tick() {
  if (!S.user) return;
  if (!document.hidden) {
    try {
      await loadOrders();
      if (S.side === 'order' && S.openId) {
        const { order } = await api('GET', `/api/orders/${encodeURIComponent(S.openId)}`);
        if (S.side === 'order' && S.openId === order.id) {
          const moved = order.updatedAt !== S.order?.updatedAt;
          S.order = order;
          if (moved && !S.formFor) renderSide();
          else if ($('#audit')) $('#audit').innerHTML = auditView(order);
        }
      }
    } catch (err) {
      if (err instanceof SignedOut) return;
    }
  }
  schedule();
}

document.addEventListener('visibilitychange', () => {
  if (!document.hidden && S.user) tick();
});

// ---------- start ----------

$('#legend').innerHTML = ROUTE.map((s) => `<li class="stn"><span class="dot" aria-hidden="true"></span><b>${esc(s.label)}</b><small>${esc(s.who)}</small></li>`).join('');

api('GET', '/api/auth/me')
  .then(({ user }) => enter(user))
  .catch((err) => { if (!(err instanceof SignedOut)) signedOut(err.message); });
</script>
